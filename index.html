  --shadow-3:0 10px 30px rgba(18,33,27,.16);
  --font-display:'Fraunces',Georgia,serif;
  --font-body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --tap:48px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
[data-theme="dark"]{
  --clr-bg:#0E1613;
  --clr-surface:#152420;
  --clr-surface-alt:#1B2C26;
  --clr-outline:#25382F;
  --clr-text:#EAF2EE;
  --clr-text-dim:#93A79D;
  --shadow-1:0 1px 3px rgba(0,0,0,.35);
  --shadow-2:0 4px 14px rgba(0,0,0,.4);
  --shadow-3:0 10px 30px rgba(0,0,0,.55);
}
/* App color themes (additive) — swap the primary brand colour; gold accent
   stays constant across themes since it reads as the "trophy" colour and
   pairs cleanly with all of these. Default (no attribute) stays Green. */
[data-theme-color="blue"]{
  --clr-primary:#1B5FA8;
  --clr-primary-dark:#123F70;
  --clr-primary-light:#2B7BC4;
}
[data-theme-color="purple"]{
  --clr-primary:#6B3FA0;
  --clr-primary-dark:#4A2B70;
  --clr-primary-light:#8656C0;
}
[data-theme-color="maroon"]{
  --clr-primary:#9C2B3D;
  --clr-primary-dark:#6E1F2B;
  --clr-primary-light:#C23A4F;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  font-family:var(--font-body);
  background:var(--clr-bg);
  color:var(--clr-text);
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
  transition:background .25s ease,color .25s ease;
}
h1,h2,h3,.font-display{font-family:var(--font-display);}
button{font-family:inherit;}
::selection{background:var(--clr-accent);color:var(--clr-primary-dark);}
a{color:inherit;}
.hidden{display:none !important;}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}

/* ---------- App shell ---------- */
#app{max-width:560px;margin:0 auto;min-height:100vh;position:relative;background:var(--clr-bg);padding-bottom:calc(74px + var(--safe-bottom));}
.topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:10px;
  padding:calc(12px + var(--safe-top)) 16px 12px;
  background:var(--clr-primary);color:#fff;
  box-shadow:var(--shadow-2);
}
.topbar h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.2px;flex:1;}
.topbar .sub{font-size:11px;opacity:.85;font-weight:500;display:block;margin-top:1px;}
.icon-btn{
  width:40px;height:40px;border-radius:50%;border:none;background:rgba(255,255,255,.14);
  color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:background .15s ease,transform .1s ease;
}
.icon-btn:active{transform:scale(.9);background:rgba(255,255,255,.28);}
.icon-btn svg{width:22px;height:22px;}
.topbar-title-wrap{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar-title-wrap h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.screen{padding:16px 16px 24px;animation:slideIn .22s cubic-bezier(.2,.8,.2,1);}
@keyframes slideIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* ---------- Cards & buttons ---------- */
.card{
  background:var(--clr-surface);border-radius:var(--radius-l);
  box-shadow:var(--shadow-1);border:1px solid var(--clr-outline);
  padding:16px;transition:transform .12s ease,box-shadow .12s ease;
}
.card-tap{cursor:pointer;}
.card-tap:active{transform:scale(.97);box-shadow:var(--shadow-2);}
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;}
.home-card{
  background:var(--clr-surface);border-radius:var(--radius-l);padding:18px 14px;
  display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow-1);
  border:1px solid var(--clr-outline);cursor:pointer;position:relative;overflow:hidden;
  transition:transform .12s ease;
}
.home-card:active{transform:scale(.96);}
.home-card.wide{grid-column:1/-1;flex-direction:row;align-items:center;}
.home-card .hc-icon{
  width:44px;height:44px;border-radius:14px;background:var(--clr-primary);color:var(--clr-accent);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.home-card .hc-icon svg{width:24px;height:24px;}
.home-card h3{margin:0;font-size:15px;font-weight:700;}
.home-card p{margin:0;font-size:12px;color:var(--clr-text-dim);line-height:1.35;}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:none;border-radius:var(--radius-m);padding:13px 20px;font-size:15px;font-weight:700;
  cursor:pointer;position:relative;overflow:hidden;transition:transform .1s ease,box-shadow .15s ease,opacity .15s;
  min-height:var(--tap);
}
.btn:active{transform:scale(.96);}
.btn-primary{background:var(--clr-primary);color:#fff;box-shadow:var(--shadow-1);}
.btn-accent{background:var(--clr-accent);color:#3a2c00;box-shadow:var(--shadow-1);}
.btn-outline{background:transparent;color:var(--clr-primary);border:1.5px solid var(--clr-primary);}
.btn-danger{background:var(--clr-danger);color:#fff;}
.btn-ghost{background:var(--clr-surface-alt);color:var(--clr-text);}
.btn-block{width:100%;}
.btn-sm{padding:9px 14px;font-size:13px;min-height:38px;border-radius:var(--radius-s);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn .ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);animation:rip .5s ease-out;pointer-events:none;}
@keyframes rip{to{transform:scale(3.2);opacity:0;}}

/* ---------- Forms ---------- */
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--clr-text-dim);margin-bottom:6px;letter-spacing:.1px;}
.input,select.input,textarea.input{
  width:100%;padding:12px 14px;border-radius:var(--radius-s);border:1.5px solid var(--clr-outline);
  background:var(--clr-surface);color:var(--clr-text);font-size:15px;font-family:inherit;
  transition:border-color .15s ease;
}
.input:focus,select.input:focus{outline:none;border-color:var(--clr-primary);}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;}
.chip{
  padding:9px 16px;border-radius:999px;background:var(--clr-surface-alt);border:1.5px solid var(--clr-outline);
  font-size:13.5px;font-weight:600;cursor:pointer;color:var(--clr-text);transition:.15s;
}
.chip.active{background:var(--clr-primary);border-color:var(--clr-primary);color:#fff;}
.chip.accent.active{background:var(--clr-accent);border-color:var(--clr-accent);color:#3a2c00;}

/* ---------- Section titles ---------- */
.section-title{font-size:13px;font-weight:800;color:var(--clr-text-dim);margin:22px 0 10px;letter-spacing:.15px;}
.section-title:first-child{margin-top:0;}

/* ---------- Bottom nav ---------- */
.bottom-nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;
  background:var(--clr-surface);border-top:1px solid var(--clr-outline);
  display:flex;z-index:50;padding-bottom:var(--safe-bottom);box-shadow:0 -2px 14px rgba(18,33,27,.08);
}
.nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;
  background:none;border:none;color:var(--clr-text-dim);cursor:pointer;font-size:10.5px;font-weight:700;
}
.nav-item svg{width:22px;height:22px;}
.nav-item.active{color:var(--clr-primary);}
[data-theme="dark"] .nav-item.active{color:var(--clr-accent);}

/* ---------- Live scoring screen ---------- */
.score-hero{
  background:linear-gradient(160deg,var(--clr-primary),var(--clr-primary-dark));
  color:#fff;border-radius:var(--radius-xl);padding:18px 18px 16px;box-shadow:var(--shadow-2);
  position:relative;overflow:hidden;
}
.score-hero .teams-line{display:flex;justify-content:space-between;font-size:12.5px;opacity:.85;font-weight:600;}
.score-big{display:flex;align-items:baseline;gap:10px;margin:6px 0 2px;}
.score-big .runs{font-family:var(--font-display);font-size:52px;font-weight:700;line-height:1;transition:transform .15s ease;}
.score-big .overs{font-size:16px;opacity:.9;font-weight:600;}
.score-pulse{animation:pulse .35s ease;}
@keyframes pulse{0%{transform:scale(1.12);}100%{transform:scale(1);}}
.score-meta{display:flex;gap:16px;margin-top:8px;font-size:12px;}
.score-meta div span{display:block;font-weight:700;font-size:14px;}
.score-meta div em{font-style:normal;opacity:.75;}
.target-line{margin-top:10px;background:rgba(255,255,255,.14);border-radius:10px;padding:8px 10px;font-size:12.5px;font-weight:600;}

.batters-box{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
.player-pill{
  background:var(--clr-surface);border:1px solid var(--clr-outline);border-radius:var(--radius-m);
  padding:10px 12px;box-shadow:var(--shadow-1);
}
.player-pill .pn{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:5px;}
.player-pill .pn .dot{width:7px;height:7px;border-radius:50%;background:var(--clr-accent-dark);}
.player-pill .pr{font-size:12px;color:var(--clr-text-dim);margin-top:2px;}
.bowler-pill{margin-top:10px;}

.over-strip{display:flex;gap:7px;overflow-x:auto;padding:12px 2px 4px;scrollbar-width:none;}
.over-strip::-webkit-scrollbar{display:none;}
.ball-chip{
  min-width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:12.5px;font-weight:800;flex-shrink:0;background:var(--clr-surface-alt);color:var(--clr-text);
  border:1.5px solid var(--clr-outline);
}
.ball-chip.four{background:var(--clr-four);color:#fff;border-color:var(--clr-four);}
.ball-chip.six{background:var(--clr-six);color:#fff;border-color:var(--clr-six);}
.ball-chip.wicket{background:var(--clr-wicket);color:#fff;border-color:var(--clr-wicket);}
.ball-chip.extra{background:var(--clr-accent);color:#3a2c00;border-color:var(--clr-accent);}

.run-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px;}
.run-btn{
  aspect-ratio:1/1;border-radius:50%;border:none;font-family:var(--font-display);
  font-size:28px;font-weight:700;cursor:pointer;color:#fff;background:var(--clr-primary);
  box-shadow:var(--shadow-2);position:relative;overflow:hidden;transition:transform .08s ease;
}
.run-btn:active{transform:scale(.9);}
.run-btn[data-run="4"]{background:var(--clr-four);}
.run-btn[data-run="6"]{background:var(--clr-six);}
.run-btn[data-run="0"]{background:var(--clr-surface-alt);color:var(--clr-text);border:2px solid var(--clr-outline);}

[data-fast-scoring="on"] .run-grid{gap:16px;margin-top:20px;}
[data-fast-scoring="on"] .run-btn{font-size:36px;box-shadow:var(--shadow-3);}
[data-fast-scoring="on"] .score-meta > div:nth-child(n+4),
[data-fast-scoring="on"] .over-strip,
[data-fast-scoring="on"] .bowler-pill .pr{display:none;}
[data-fast-scoring="on"] .action-bar,[data-fast-scoring="on"] .action-bar2{gap:10px;}

.extras-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px;}
.extra-btn{
  padding:11px 4px;border-radius:var(--radius-s);border:1.5px solid var(--clr-outline);
  background:var(--clr-surface);color:var(--clr-text);font-weight:700;font-size:12.5px;cursor:pointer;
}
.extra-btn.active-toggle{background:var(--clr-accent);border-color:var(--clr-accent);color:#3a2c00;}

.action-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;}
.action-bar .btn{font-size:12.5px;padding:11px 4px;border-radius:var(--radius-s);}
.action-bar2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}

/* ---------- Bottom sheet / modal ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(10,18,15,.5);z-index:100;display:flex;align-items:flex-end;
  opacity:0;pointer-events:none;transition:opacity .2s ease;
}
.overlay.open{opacity:1;pointer-events:auto;}
.sheet{
  background:var(--clr-surface);width:100%;max-width:560px;margin:0 auto;border-radius:22px 22px 0 0;
  max-height:88vh;overflow-y:auto;padding:10px 18px calc(20px + var(--safe-bottom));
  transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);box-shadow:0 -8px 30px rgba(0,0,0,.25);
}
.overlay.open .sheet{transform:translateY(0);}
.sheet-handle{width:38px;height:4px;background:var(--clr-outline);border-radius:99px;margin:6px auto 14px;}
.sheet h2{margin:0 0 14px;font-size:18px;}
.sheet-close{position:absolute;top:10px;right:14px;}
.dialog-center{align-items:center;justify-content:center;}
.dialog-box{
  background:var(--clr-surface);border-radius:var(--radius-l);max-width:400px;width:88%;padding:20px;
  transform:scale(.85);opacity:0;transition:.2s ease;box-shadow:var(--shadow-3);
}
.overlay.open .dialog-box{transform:scale(1);opacity:1;}

.option-list{display:flex;flex-direction:column;gap:8px;}
.option-item{
  display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:var(--radius-m);
  background:var(--clr-surface-alt);cursor:pointer;font-weight:600;font-size:14.5px;border:1.5px solid transparent;
}
.option-item:active{transform:scale(.98);}
.option-item .oi-icon{
  width:34px;height:34px;border-radius:10px;background:var(--clr-primary);color:#fff;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;font-weight:800;
}
.option-item.danger .oi-icon{background:var(--clr-danger);}
.player-select-item{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:var(--radius-m);background:var(--clr-surface-alt);margin-bottom:8px;cursor:pointer;font-weight:600;}
.player-select-item:active{transform:scale(.98);}
.player-select-item .psi-stat{font-size:11.5px;color:var(--clr-text-dim);font-weight:500;}

/* ---------- Tables ---------- */
.table-wrap{overflow-x:auto;border-radius:var(--radius-m);border:1px solid var(--clr-outline);}
table.score-table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:460px;}
table.score-table th{
  background:var(--clr-surface-alt);color:var(--clr-text-dim);text-align:left;padding:9px 10px;
  font-size:10.5px;font-weight:800;letter-spacing:.3px;position:sticky;top:0;
}
table.score-table td{padding:9px 10px;border-top:1px solid var(--clr-outline);font-weight:600;}
table.score-table tr.current-row{background:rgba(11,110,79,.08);}
table.score-table td:first-child,table.score-table th:first-child{position:sticky;left:0;background:var(--clr-surface);}
.tabs{display:flex;gap:6px;background:var(--clr-surface-alt);border-radius:999px;padding:4px;margin-bottom:14px;}
.tab-btn{flex:1;border:none;background:none;padding:9px 0;border-radius:999px;font-weight:700;font-size:13px;color:var(--clr-text-dim);cursor:pointer;}
.tab-btn.active{background:var(--clr-primary);color:#fff;}

/* ---------- Misc ---------- */
.empty-state{text-align:center;padding:48px 20px;color:var(--clr-text-dim);}
.empty-state svg{width:56px;height:56px;opacity:.4;margin-bottom:10px;}
.empty-state p{font-size:13.5px;margin:4px 0 16px;}
.match-card{display:flex;align-items:center;gap:12px;padding:14px;margin-bottom:10px;}
.match-card .mc-icon{width:42px;height:42px;border-radius:12px;background:var(--clr-primary);color:var(--clr-accent);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0;}
.match-card .mc-body{flex:1;min-width:0;}
.match-card .mc-title{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.match-card .mc-sub{font-size:11.5px;color:var(--clr-text-dim);margin-top:2px;}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:10.5px;font-weight:800;background:var(--clr-accent);color:#3a2c00;}
.badge.live{background:var(--clr-danger);color:#fff;}
.toast-wrap{position:fixed;bottom:calc(90px + var(--safe-bottom));left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;width:calc(100% - 32px);max-width:520px;}
.toast{background:var(--clr-text);color:var(--clr-bg);padding:11px 18px;border-radius:99px;font-size:13px;font-weight:700;box-shadow:var(--shadow-3);animation:toastIn .25s ease;}
@keyframes toastIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.flash-boundary{animation:flashFour .5s ease;}
@keyframes flashFour{0%{box-shadow:0 0 0 0 rgba(45,108,223,.6);}100%{box-shadow:0 0 0 26px rgba(45,108,223,0);}}
.flash-six{animation:flashSix .5s ease;}
@keyframes flashSix{0%{box-shadow:0 0 0 0 rgba(0,112,79,.6);}100%{box-shadow:0 0 0 26px rgba(0,112,79,0);}}
.flash-wicket{animation:flashWkt .55s ease;}
@keyframes flashWkt{0%{box-shadow:0 0 0 0 rgba(38,50,56,.55);}100%{box-shadow:0 0 0 30px rgba(38,50,56,0);}}
.switch{position:relative;width:46px;height:26px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;}
.switch .slider{position:absolute;inset:0;background:var(--clr-outline);border-radius:99px;cursor:pointer;transition:.2s;}
.switch .slider:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3);}
.switch input:checked + .slider{background:var(--clr-primary);}
.switch input:checked + .slider:before{transform:translateX(20px);}
.setting-row{display:flex;justify-content:space-between;align-items:center;padding:13px 4px;border-bottom:1px solid var(--clr-outline);}
.setting-row:last-child{border-bottom:none;}
.setting-row .sr-label{font-weight:700;font-size:14px;}
.setting-row .sr-sub{font-size:11.5px;color:var(--clr-text-dim);margin-top:1px;}
.color-dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--clr-surface);box-shadow:0 0 0 1.5px var(--clr-outline);cursor:pointer;}
.color-dot.active{box-shadow:0 0 0 2px var(--clr-primary);}
.search-bar{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.16);border-radius:99px;padding:8px 14px;margin-top:2px;}
.search-bar input{flex:1;background:none;border:none;color:#fff;font-size:13.5px;outline:none;}
.search-bar input::placeholder{color:rgba(255,255,255,.7);}
.result-banner{background:linear-gradient(135deg,var(--clr-accent),var(--clr-accent-dark));border-radius:var(--radius-l);padding:20px;text-align:center;box-shadow:var(--shadow-2);color:#3a2c00;}
.result-banner h2{margin:0 0 4px;font-size:20px;}
.result-banner svg{width:44px;height:44px;display:block;margin:0 auto 6px;}
.mc-icon{border-radius:12px;color:var(--clr-accent);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0;}
.result-banner p{margin:0;font-weight:600;font-size:13.5px;}
.partnership-line{display:flex;justify-content:space-between;font-size:12.5px;padding:6px 0;border-bottom:1px dashed var(--clr-outline);}
.fow-line{font-size:12px;color:var(--clr-text-dim);padding:3px 0;}
@media (max-width:360px){.score-big .runs{font-size:44px;}.run-btn{font-size:22px;}}
.milestone-card{
  position:fixed;top:22%;left:50%;transform:translate(-50%,0) scale(.7);z-index:300;
  background:linear-gradient(135deg,var(--clr-accent),var(--clr-accent-dark));color:#3a2c00;
  padding:22px 32px;border-radius:var(--radius-xl);box-shadow:var(--shadow-3);text-align:center;
  animation:milestoneIn .4s cubic-bezier(.2,.8,.2,1) forwards;pointer-events:none;
}
.milestone-card.milestone-out{animation:milestoneOut .4s ease forwards;}
.milestone-emoji{font-size:40px;line-height:1;}
.milestone-text{font-family:var(--font-display);font-weight:700;font-size:19px;margin-top:6px;white-space:nowrap;}
@keyframes milestoneIn{0%{opacity:0;transform:translate(-50%,-10px) scale(.7);}60%{transform:translate(-50%,4px) scale(1.05);}100%{opacity:1;transform:translate(-50%,0) scale(1);}}
@keyframes milestoneOut{to{opacity:0;transform:translate(-50%,-14px) scale(.85);}}
.coin-3d-stage{perspective:900px;display:flex;justify-content:center;padding:18px 0 8px;}
.coin-3d{width:120px;height:120px;position:relative;transform-style:preserve-3d;transform:rotateY(0deg);}
.coin-3d.spinning{animation-name:coinSpinHeads;animation-duration:1.7s;animation-timing-function:cubic-bezier(.3,.1,.2,1);animation-fill-mode:forwards;}
.coin-3d.spinning.land-tails{animation-name:coinSpinTails;}
.coin-face{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;color:#5c4400;background:radial-gradient(circle at 35% 30%,#FFE9A8,var(--clr-accent) 60%,var(--clr-accent-dark));box-shadow:0 6px 18px rgba(0,0,0,.35),inset 0 3px 6px rgba(255,255,255,.6),inset 0 -4px 8px rgba(0,0,0,.15);}
.coin-face.coin-back{transform:rotateY(180deg);}
.coin-face .coin-label{font-size:15px;letter-spacing:.5px;}
.coin-face .coin-icon{font-size:30px;line-height:1;margin-bottom:2px;}
@keyframes coinSpinHeads{0%{transform:rotateY(0deg) translateY(0);}45%{transform:rotateY(1440deg) translateY(-46px);}100%{transform:rotateY(1800deg) translateY(0);}}
@keyframes coinSpinTails{0%{transform:rotateY(0deg) translateY(0);}45%{transform:rotateY(1440deg) translateY(-46px);}100%{transform:rotateY(1980deg) translateY(0);}}
/* ==========================================================================
   PLAYER ID CARD (additive presentation layer — reads existing player data)
   ========================================================================== */
.idc-wrap{display:flex;justify-content:center;padding:4px 0 6px}
.idc{--g:#0B6E4F;--g2:#13a374;--gold:#D4AF37;--gold2:#F3D77A;
  position:relative;width:100%;max-width:360px;aspect-ratio:54/86;border-radius:22px;overflow:hidden;
  background:radial-gradient(120% 70% at 50% 0%,#0f3b2c 0%,#0a1f18 45%,#050c0a 100%);
  border:3px solid var(--gold);box-shadow:0 0 0 1px #5c4a12 inset,0 14px 36px rgba(0,0,0,.45);
  color:#F1F5F2;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;display:flex;flex-direction:column;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.idc::before{content:"";position:absolute;inset:7px;border:1px solid rgba(212,175,55,.35);border-radius:16px;pointer-events:none}
.idc-wm{position:absolute;right:-60px;top:38%;width:240px;height:240px;border-radius:50%;
  border:2px dashed rgba(19,163,116,.18);pointer-events:none}
.idc-wm::after{content:"";position:absolute;inset:26px;border-radius:50%;border:2px solid rgba(212,175,55,.10)}
.idc-head{position:relative;padding:16px 16px 10px;text-align:center;
  background:linear-gradient(180deg,rgba(11,110,79,.55),rgba(11,110,79,0))}
.idc-logo{width:42px;height:42px;margin:0 auto 6px;border-radius:12px;background:linear-gradient(145deg,#0e8a63,#084d38);
  border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;
  font:800 24px Georgia,serif;color:var(--gold2)}
.idc-brand{font-weight:900;letter-spacing:2.2px;font-size:15px;color:var(--gold2)}
.idc-club{font-weight:700;letter-spacing:1.1px;font-size:9.5px;color:#cfe3da;margin-top:2px}
.idc-ribbon{display:inline-block;margin-top:8px;padding:4px 12px;border-radius:999px;background:var(--g);
  border:1px solid var(--gold);font-weight:800;font-size:9.5px;letter-spacing:1.6px;color:#fff}
.idc-body{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;padding:4px 18px 0}
.idc-photo{position:relative;width:104px;height:104px;border-radius:50%;padding:3px;
  background:conic-gradient(var(--gold),var(--g2),var(--gold),var(--g2),var(--gold))}
.idc-photo img,.idc-photo .idc-ph{width:100%;height:100%;border-radius:50%;object-fit:cover;display:flex;align-items:center;
  justify-content:center;background:#0d2a21;color:var(--gold2);font:800 30px Georgia,serif;border:3px solid #06110d}
.idc-jbadge{position:absolute;right:-4px;bottom:2px;min-width:34px;height:34px;padding:0 6px;border-radius:17px;background:var(--gold);
  color:#14100a;font:900 14px/34px Arial,sans-serif;text-align:center;border:2px solid #06110d}
.idc-name{margin:10px 0 2px;font:800 21px/1.15 Georgia,'Noto Serif Bengali',serif;text-align:center;color:#fff;word-break:break-word}
.idc-role{font-size:11px;font-weight:800;letter-spacing:1.4px;color:var(--g2);text-transform:uppercase}
.idc-grid{width:100%;margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.idc-f{background:rgba(255,255,255,.05);border:1px solid rgba(212,175,55,.22);border-radius:10px;padding:7px 9px;min-width:0}
.idc-f.full{grid-column:1/-1}
.idc-l{font-size:8.5px;font-weight:800;letter-spacing:1.3px;color:#9fb8ae;text-transform:uppercase}
.idc-v{font-size:12.5px;font-weight:700;color:#fff;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.idc-v.mono{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.5px;color:var(--gold2)}
.idc-st{display:inline-flex;align-items:center;gap:5px}
.idc-st i{width:7px;height:7px;border-radius:50%;display:inline-block}
.idc-foot{position:relative;display:flex;align-items:center;gap:10px;margin-top:auto;padding:10px 14px 14px;
  border-top:1px solid rgba(212,175,55,.35);background:linear-gradient(0deg,rgba(11,110,79,.45),rgba(11,110,79,0))}
.idc-foot .t1{font-weight:900;font-size:11px;letter-spacing:1.6px;color:var(--gold2)}
.idc-foot .t2{font-size:9px;color:#cfe3da;margin-top:2px;letter-spacing:.6px}
.idc-qr{width:58px;height:58px;flex-shrink:0;margin-left:auto;background:#fff;border-radius:8px;padding:3px;border:2px solid var(--gold)}
.idc-qr svg{width:100%;height:100%;display:block}
.idc-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 4px}
.idc-actions .btn{width:100%}
.idc-dl{width:100%;border-radius:12px;display:block}
.idc-dtable{width:100%;border-collapse:collapse;font-size:13px}
.idc-dtable td{padding:9px 4px;border-bottom:1px solid var(--clr-outline);vertical-align:top}
.idc-dtable td:first-child{color:var(--clr-text-dim);font-weight:700;width:42%}
.idc-consent{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:var(--clr-text-dim);margin-top:4px}
.idc-consent input{margin-top:2px;width:18px;height:18px;flex-shrink:0}
#printArea .idc-print{display:flex;justify-content:center;padding-top:10mm}
#printArea .idc{width:54mm;max-width:none;height:auto;min-height:86mm;aspect-ratio:auto;box-shadow:none;font-size:70%}
#printArea .idc-head{padding:9px 9px 6px}#printArea .idc-logo{width:26px;height:26px;font-size:15px;border-radius:8px;margin-bottom:3px}
#printArea .idc-brand{font-size:9.5px;letter-spacing:1.4px}#printArea .idc-club{font-size:6px}
#printArea .idc-ribbon{font-size:6px;padding:2px 8px;margin-top:4px}
#printArea .idc-photo{width:54px;height:54px}#printArea .idc-photo .idc-ph{font-size:16px;border-width:2px}#printArea .idc-jbadge{min-width:22px;height:22px;font-size:9px;line-height:22px;border-radius:11px}
#printArea .idc-name{font-size:13px;margin-top:5px}#printArea .idc-role{font-size:7px}
#printArea .idc-grid{gap:4px;margin-top:6px}#printArea .idc-f{padding:3px 5px;border-radius:6px}
#printArea .idc-l{font-size:5.5px}#printArea .idc-v{font-size:8px}
#printArea .idc-foot{padding:6px 8px 8px;gap:6px}#printArea .idc-foot .t1{font-size:7px}#printArea .idc-foot .t2{font-size:5.5px}
#printArea .idc-qr{width:36px;height:36px;padding:2px}

/* ==========================================================================
   MATCH CARDS (navy/blue identity) + SCHEDULE & COUNTDOWN (violet identity)
   ========================================================================== */
.mh-tabs{display:flex;gap:6px;background:var(--clr-surface-alt);padding:4px;border-radius:14px;margin-bottom:14px}
.mh-tabs button{flex:1;border:0;background:transparent;padding:10px 6px;border-radius:10px;font:700 13px var(--font-body);color:var(--clr-text-dim);cursor:pointer}
.mh-tabs button.active{background:var(--clr-surface);color:var(--clr-text);box-shadow:var(--shadow-1)}
.mh-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px}
.mh-filters{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.mh-filters::-webkit-scrollbar{display:none}
.mh-filters span{flex-shrink:0;padding:7px 13px;border-radius:999px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}

/* ---- Match card ---- */
.mc2{position:relative;border-radius:20px;padding:14px 14px 12px;margin-bottom:14px;color:#F8FAFC;overflow:hidden;
  background:linear-gradient(155deg,#13213d 0%,#0B1220 55%,#0a1a2e 100%);border:1px solid rgba(147,197,253,.18);
  box-shadow:0 8px 22px rgba(11,18,32,.35);transition:transform .18s ease,box-shadow .18s ease}
.mc2::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,#2563EB,#06B6D4)}
.mc2:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(37,99,235,.28)}
.mc2:active{transform:scale(.985)}
.mc2-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.mc2-type{font-size:10.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#93C5FD;background:rgba(37,99,235,.18);
  border:1px solid rgba(147,197,253,.3);padding:4px 9px;border-radius:999px;max-width:62%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-pill{font-size:10.5px;font-weight:800;letter-spacing:.6px;padding:4px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.st-pill i{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}
.st-live i{animation:stBlink 1s infinite}
@keyframes stBlink{50%{opacity:.2}}
.mc2-teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.mc2-team{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.mc2-logo{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 17px var(--font-body);
  color:#fff;border:3px solid var(--jc,#2563EB);box-shadow:0 0 0 3px rgba(11,18,32,.9),0 4px 12px rgba(0,0,0,.35);overflow:hidden;background:var(--jc,#2563EB)}
.mc2-logo img{width:100%;height:100%;object-fit:cover}
.mc2-tname{margin-top:7px;font-weight:800;font-size:13.5px;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.mc2-tsub{font-size:10px;color:#93C5FD;font-weight:700;letter-spacing:.8px;margin-top:2px}
.mc2-jersey{width:26px;height:4px;border-radius:2px;margin-top:5px;background:var(--jc,#2563EB)}
.mc2-vs{font:900 13px var(--font-body);color:#06B6D4;background:rgba(6,182,212,.12);border:1px solid rgba(6,182,212,.35);
  width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.mc2-score{margin-top:10px;text-align:center;font-size:12.5px;font-weight:700;color:#F8FAFC;background:rgba(255,255,255,.05);border-radius:10px;padding:6px 8px}
.mc2-meta{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin-top:12px;font-size:12px;color:#cbd5e1}
.mc2-meta div{display:flex;gap:6px;align-items:center;min-width:0}
.mc2-meta b{color:#F8FAFC;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc2-cd{margin-top:10px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:11.5px;font-weight:700;color:#93C5FD}
.mc2-cd b{font-family:ui-monospace,Menlo,monospace;color:#F8FAFC;background:rgba(37,99,235,.25);padding:2px 8px;border-radius:7px;letter-spacing:.5px}
.mc2-actions{display:flex;gap:8px;margin-top:12px}
.mc2-btn{flex:1;border:0;border-radius:12px;padding:11px 10px;font:800 13.5px var(--font-body);cursor:pointer;transition:transform .12s ease,filter .12s ease}
.mc2-btn:active{transform:scale(.96)}
.mc2-btn.primary{background:linear-gradient(135deg,#2563EB,#06B6D4);color:#fff;box-shadow:0 6px 16px rgba(37,99,235,.35)}
.mc2-btn.ghost{background:rgba(147,197,253,.1);color:#F8FAFC;border:1px solid rgba(147,197,253,.35)}
.mc2-btn.start{background:#F8FAFC;color:#0B1220}
.mc2-note{margin-top:8px;font-size:11px;color:#93C5FD;text-align:center}

/* ---- Schedule (violet) ---- */
.sch{background:linear-gradient(170deg,#21154a 0%,#170F2E 50%,#120b25 100%);border-radius:22px;padding:14px;color:#fff;
  border:1px solid rgba(196,181,253,.18);box-shadow:0 10px 26px rgba(23,15,46,.35)}
.sch .mh-filters span{background:rgba(196,181,253,.12);color:#C4B5FD;border:1px solid rgba(196,181,253,.25)}
.sch .mh-filters span.active{background:linear-gradient(135deg,#7C3AED,#D946EF);color:#fff;border-color:transparent}
.sch-hero{border-radius:18px;padding:14px;background:linear-gradient(135deg,rgba(124,58,237,.45),rgba(217,70,239,.28));
  border:1px solid rgba(196,181,253,.35);margin-bottom:16px;text-align:center}
.sch-kicker{font-size:10.5px;font-weight:800;letter-spacing:1.4px;color:#C4B5FD;text-transform:uppercase}
.sch-hero-t{font-weight:800;font-size:16px;margin:6px 0 2px;line-height:1.25}
.sch-hero-s{font-size:12px;color:#e9d5ff}
.sch-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 10px}
.sch-tile{background:rgba(23,15,46,.75);border:1px solid rgba(196,181,253,.3);border-radius:14px;padding:10px 0 8px}
.sch-tile b{display:block;font:800 26px/1 ui-monospace,Menlo,Consolas,monospace;color:#fff;letter-spacing:1px}
.sch-tile span{display:block;margin-top:5px;font-size:9.5px;font-weight:800;letter-spacing:1.2px;color:#C4B5FD;text-transform:uppercase}
.sch-label{display:inline-block;padding:4px 11px;border-radius:999px;font-size:11.5px;font-weight:800;background:#D946EF;color:#fff}
.sch-label.today{background:#D946EF}.sch-label.tomorrow{background:#7C3AED}.sch-label.soon{background:#F59E0B;color:#1c1203}.sch-label.later{background:rgba(196,181,253,.2);color:#C4B5FD}
.sch-day{display:flex;gap:12px;margin-top:14px}
.sch-date{width:54px;flex-shrink:0;text-align:center;border-radius:14px;padding:7px 0;background:linear-gradient(160deg,#7C3AED,#D946EF);height:max-content}
.sch-date .d{font:800 22px/1 var(--font-body)}.sch-date .m{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;margin-top:3px}
.sch-date .w{font-size:9.5px;color:#f5d0fe;margin-top:2px}
.sch-date.other{background:rgba(196,181,253,.16)}
.sch-line{flex:1;min-width:0;border-left:2px dashed rgba(196,181,253,.35);padding-left:14px;display:flex;flex-direction:column;gap:10px}
.sch-dayname{font-size:12px;font-weight:800;color:#C4B5FD;letter-spacing:.6px}
.sch-item{position:relative;background:rgba(255,255,255,.05);border:1px solid rgba(196,181,253,.2);border-radius:14px;padding:10px 12px;cursor:pointer;transition:transform .15s ease,background .15s ease}
.sch-item:active{transform:scale(.985)}
.sch-item::before{content:"";position:absolute;left:-21px;top:16px;width:12px;height:12px;border-radius:50%;background:#D946EF;border:2px solid #170F2E;box-shadow:0 0 0 2px rgba(217,70,239,.4)}
.sch-item .r1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sch-time{font:800 13px var(--font-body);color:#fff}
.sch-tag{font-size:9.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:#C4B5FD;border:1px solid rgba(196,181,253,.35);padding:2px 7px;border-radius:999px;white-space:nowrap}
.sch-teams{margin-top:5px;font-weight:700;font-size:14px;line-height:1.3}
.sch-sub{font-size:11.5px;color:#d8c8ff;margin-top:3px}
.sch-cdi{margin-top:7px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sch-cdi b{font:800 13px ui-monospace,Menlo,monospace;color:#fff;background:rgba(124,58,237,.35);padding:3px 9px;border-radius:8px;letter-spacing:.5px}
.sch-start{border:0;border-radius:10px;padding:7px 12px;font:800 12px var(--font-body);background:#fff;color:#170F2E;cursor:pointer}
.sch-empty{text-align:center;padding:26px 10px;color:#d8c8ff;font-size:13px}
.sch-addbtn{border:0;border-radius:12px;padding:10px 14px;font:800 13px var(--font-body);color:#fff;background:linear-gradient(135deg,#7C3AED,#D946EF);cursor:pointer;box-shadow:0 6px 16px rgba(124,58,237,.35)}
.mc2-addbtn{border:0;border-radius:12px;padding:10px 14px;font:800 13px var(--font-body);color:#fff;background:linear-gradient(135deg,#2563EB,#06B6D4);cursor:pointer}
.sch-hist{font-size:12px;color:var(--clr-text-dim);margin:4px 0 0;padding-left:16px}
.sch-form .chip-row .chip{cursor:pointer}

/* ---- Live sharing / cloud sync (additive) ---- */
.lv-bar{padding:12px 14px}
.lv-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lv-pill{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--clr-surface-alt);color:var(--clr-text-dim)}
.lv-pill.on{background:#009270;color:#fff}.lv-pill.pause{background:#E0A526;color:#2b1d00}
.lv-sync{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--clr-text-dim)}
.lv-btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.lv-note{font-size:11.5px;color:var(--clr-text-dim);margin-top:8px}
.lv-viewer{margin-bottom:12px}
.lv-banner{font-size:13px}.lv-banner.paused{color:#B7791F}.lv-banner.stopped{color:var(--clr-danger)}
.lv-ro{font-size:12px;color:var(--clr-text-dim);margin:6px 0 10px}
.lv-subs{border-top:1px solid var(--clr-outline);padding-top:10px}
.lv-subs .chip{cursor:pointer}
body.lv-mode #runGrid, body.lv-mode .action-bar, body.lv-mode .action-bar2, body.lv-mode .extra-btn, body.lv-mode .bottom-nav{display:none !important}

.ucd{text-align:center;margin:14px 0 2px;padding:12px 8px 10px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(147,197,253,.15)}
.ucd-time{font:800 30px/1.1 var(--font-body);letter-spacing:.5px;color:#F8FAFC;font-variant-numeric:tabular-nums;white-space:nowrap}
.ucd-at{margin-top:10px;font-size:14px;font-weight:500;color:#E3A008}
@media (max-width:360px){.ucd-time{font-size:25px}}

/* ===== Red · Blue · White · Green theme (cricket-app style) ===== */
[data-theme-color="cricbuzz"]{
  --clr-primary:#009270; --clr-primary-dark:#00704F; --clr-primary-light:#00A57E;
  --clr-accent:#FFFFFF; --clr-accent-dark:#1866DB;
  --clr-danger:#37474F; --clr-danger-dark:#263238; --clr-info:#1866DB;
  --clr-four:#1866DB; --clr-six:#00704F; --clr-wicket:#263238;
}
body[data-theme-color="cricbuzz"]:not([data-theme="dark"]){
  --clr-bg:#FFFFFF; --clr-surface:#FFFFFF; --clr-surface-alt:#F2F4F7; --clr-outline:#E3E7EC;
  --clr-text:#1A1A1A; --clr-text-dim:#5E6A75;
}
.color-dot[data-theme-color-pick="cricbuzz"]{background:conic-gradient(#009270 0 34%,#1866DB 0 67%,#FFFFFF 0) !important}
/* four-colour accents on Home (theme only) */
[data-theme-color="cricbuzz"] .home-card[data-action="resume-match"] .hc-icon{background:#0B4FA8}
[data-theme-color="cricbuzz"] .home-card[data-action="go-history"] .hc-icon{background:#1866DB}
[data-theme-color="cricbuzz"] .home-card[data-action="go-players"] .hc-icon{background:#1866DB}
[data-theme-color="cricbuzz"] .home-card[data-action="go-tournaments"] .hc-icon{background:#00704F}
[data-theme-color="cricbuzz"] .topbar{border-bottom:3px solid #1866DB}
[data-theme-color="cricbuzz"] .section-title{color:#1866DB}
[data-theme-color="cricbuzz"] .nav-item.active{color:#1866DB}
/* Live summary panel */
.cbx{background:var(--clr-surface);border:1px solid var(--clr-outline);border-radius:var(--radius-l);margin:14px 0 4px;overflow:hidden}
.cbx-need{padding:12px 14px 4px;font-size:15.5px;font-weight:600;color:#1866DB}
.cbx-need.first{color:#1866DB}
.cbx-need.done{color:#009270}
.cbx-stats{display:flex;flex-wrap:wrap;gap:6px 18px;padding:8px 14px 12px;font-size:14px;color:var(--clr-text-dim)}
.cbx-stats b{color:var(--clr-text);font-weight:600;margin-left:4px}
.cbx-pship{display:flex;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--clr-outline);font-size:13.5px;color:var(--clr-text-dim)}

/* ---- Match graphs ---- */
.gr-head{font-weight:800;font-size:15px;margin:2px 0 10px}
.gr-tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.gr-tabs::-webkit-scrollbar{display:none}
.gr-tabs button{flex-shrink:0;border:0;border-radius:999px;padding:9px 16px;font:600 14px var(--font-body);background:#D3E3DC;color:#1A1A1A;cursor:pointer}
.gr-tabs button.on{background:#087A55;color:#fff}
.gr-box{background:var(--clr-surface);border:1px solid var(--clr-outline);border-radius:18px;padding:12px}
.gr-seg{display:inline-flex;flex-wrap:wrap;gap:2px;background:var(--clr-surface-alt);border-radius:12px;padding:4px;margin-bottom:10px;max-width:100%}
.gr-seg button{border:0;background:transparent;padding:7px 12px;border-radius:9px;font:500 13px var(--font-body);color:var(--clr-text);cursor:pointer;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gr-seg button.on{background:var(--clr-surface);box-shadow:var(--shadow-1)}
.gr-ytitle{font-size:13px;color:var(--clr-text-dim);margin:2px 0 2px 4px}
.gr-svg{width:100%;height:auto;display:block}
.gr-t{font-size:10px;fill:#6b7785;font-family:var(--font-body)}
.gr-legend{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;margin-top:8px;font-size:13px;color:var(--clr-text)}
.gr-legend span{display:inline-flex;align-items:center;gap:6px}
.gr-legend i{width:11px;height:11px;border-radius:50%;display:inline-block}
.gr-legend i.dash{width:18px;height:0;border-top:3px dashed #333;border-radius:0}
.gr-empty{text-align:center;color:var(--clr-text-dim);padding:28px 0;font-size:13px}
.gr-note{font-size:11.5px;color:#009270;margin-top:8px;font-weight:600}
.gr-ps{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;padding:12px 2px;border-bottom:1px solid var(--clr-outline)}
.gr-ps:last-child{border-bottom:0}
.gr-ps-p{display:flex;align-items:center;gap:8px;min-width:0}
.gr-ps-p.r{justify-content:flex-end;text-align:right}
.gr-ps-n{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:88px}
.gr-ps-s{font-size:12.5px;color:var(--clr-text-dim)}
.gr-ps-mid{text-align:center;min-width:84px}
.gr-ps-t{font-weight:700;font-size:15px}
.gr-live{color:#1866DB}
.gr-ps-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:5px auto 3px;min-width:12px}
.gr-ps-w{font-size:10.5px;color:var(--clr-text-dim)}
.cbx-foot{padding:10px 14px;border-top:1px solid var(--clr-outline)}
body.lv-mode .gr-open-btn{display:none !important}
/* ---- player name menu / performance / bio ---- */
[data-pmenu]{cursor:pointer;text-decoration:underline;text-decoration-color:rgba(24,102,219,.35);text-underline-offset:3px}
body.lv-mode [data-pmenu]{pointer-events:auto}
.pm-menu{position:fixed;z-index:10000;background:#fff;color:#1A1A1A;border-radius:14px;box-shadow:0 10px 32px rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.06);
  padding:6px;min-width:230px;opacity:0;transform:translateY(-4px) scale(.98);transition:opacity .12s ease,transform .12s ease}
.pm-menu.open{opacity:1;transform:none}
.pm-menu button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;padding:12px 14px;border-radius:10px;
  font:500 15.5px var(--font-body);color:#1A1A1A;cursor:pointer;text-align:left}
.pm-menu button svg{color:#555;flex-shrink:0}
.pm-menu button:active,.pm-menu button:hover{background:#F2F4F7}
.pm-sec{font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--clr-text-dim);margin:12px 0 6px}
.pm-none{font-size:13px;color:var(--clr-text-dim);padding:2px 0 4px}
.pm-card{border:1px solid var(--clr-outline);border-radius:14px;padding:12px;margin-bottom:8px}
.pm-big{font:800 26px/1.1 var(--font-body)}.pm-big small{font-size:14px;color:var(--clr-text-dim);font-weight:600}
.pm-sub{font-size:12.5px;color:var(--clr-text-dim);margin-top:3px}
.pm-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px;text-align:center;font-size:11px;color:var(--clr-text-dim)}
.pm-grid b{display:block;font-size:15px;color:var(--clr-text)}
.pm-grid.four{margin-top:0}
.pm-balls{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.pm-balls > *{transform:scale(.85)}
.pm-pom{margin-top:6px;font-weight:800;color:#1866DB}
.pm-na{color:var(--clr-text-dim);font-style:italic}
.pm-about{margin:0 0 8px;font-size:13.5px;line-height:1.45}
.pm-log{cursor:pointer;padding:12px 14px}
.pm-log-t{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:13.5px}
.pm-log-d{font-weight:500;font-size:11.5px;color:var(--clr-text-dim);white-space:nowrap}
.pm-log-f{font-size:13px;margin-top:5px}
.pm-log-r{font-size:11.5px;color:var(--clr-text-dim);margin-top:3px}
.pm-note{font-size:11.5px;color:var(--clr-text-dim);text-align:center;margin:8px 0 0}

/* ---------------------------- UTILITIES ---------------------------- */
const $ = (sel,root=document)=>root.querySelector(sel);
const $$ = (sel,root=document)=>Array.from(root.querySelectorAll(sel));
function uid(prefix){ return prefix+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function esc(str){ return String(str==null?'':str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function clamp(n,min,max){ return Math.max(min,Math.min(max,n)); }
function fmtDate(iso){
  try{ const d = new Date(iso); return d.toLocaleDateString(undefined,{day:'2-digit',month:'short',year:'numeric'}); }catch(e){ return iso; }
}
function fmtOvers(balls,ballsPerOver){
  ballsPerOver = ballsPerOver || 6;
  const o = Math.floor(balls/ballsPerOver), b = balls%ballsPerOver;
  return o+'.'+b;
}
function oversToBalls(oversFloat,ballsPerOver){
  ballsPerOver = ballsPerOver || 6;
  const whole = Math.floor(oversFloat);
  const part = Math.round((oversFloat-whole)*10);
  return whole*ballsPerOver+part;
}
function strikeRate(runs,balls){ return balls>0 ? ((runs/balls)*100).toFixed(1) : '0.0'; }
function economy(runs,balls){ return balls>0 ? (runs/(balls/6)).toFixed(2) : '0.00'; }
function battingAverage(runs,outs){ return outs>0 ? (runs/outs).toFixed(2) : runs>0 ? runs.toFixed(2) : '0.00'; }
function ordinal(n){ const s=['th','st','nd','rd'],v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
function debounce(fn,ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; }
function vibrate(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){} }
function toast(msg,ms=2000){
  const wrap = $('#toastWrap');
  const el = document.createElement('div');
  el.className='toast'; el.textContent=msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translateY(10px)'; el.style.transition='.25s'; setTimeout(()=>el.remove(),260); }, ms);
}
function initials(name){
  if(!name) return '?';
  const parts = name.trim().split(/\s+/);
  return ((parts[0]?.[0]||'')+(parts[1]?.[0]||'')).toUpperCase() || name[0].toUpperCase();
}
function attachRipple(container){
  container.addEventListener('pointerdown',e=>{
    const btn = e.target.closest('.btn');
    if(!btn || !container.contains(btn)) return;
    const rect = btn.getBoundingClientRect();
    const r = document.createElement('span');
    r.className='ripple';
    const size = Math.max(rect.width,rect.height);
    r.style.width = r.style.height = size+'px';
    r.style.left = (e.clientX-rect.left-size/2)+'px';
    r.style.top = (e.clientY-rect.top-size/2)+'px';
    btn.appendChild(r);
    setTimeout(()=>r.remove(),500);
  });
}

/* ==========================================================================
   CRICKET ENGINE
   Data model for a match:
   match = {
     id, title, venue, date, scorer, umpire, overs, ballsPerOver,
     teamA:{id,name,color}, teamB:{id,name,color},
     squadA:[playerRef], squadB:[playerRef],
     tossWinner:'A'|'B', tossChoice:'bat'|'bowl',
     status:'live'|'completed'|'abandoned',
     result:{text, winner},
     innings:[ inningsObj, inningsObj ],
     currentInnings:0
   }
   inningsObj = {
     battingTeam:'A'|'B', bowlingTeam:'A'|'B',
     runs, wickets, balls, target(optional),
     batters:{playerId:{runs,balls,fours,sixes,out,outType,bowlerId,fielderId,onStrike}},
     bowlers:{playerId:{balls,runs,wickets,maidens,runsThisOver}},
     battingOrder:[playerId...], // order they came in
     strikerId, nonStrikerId, bowlerId, prevBowlerId,
     timeline:[ ballEvent... ], // full ball by ball log for undo/redo & last-over strip
     fallOfWickets:[{score,wicket,over,playerName}],
     partnerships:[{p1,p2,runs,balls}],
     thisOverBalls:[ display strings ],
     isComplete:false
   }
   ballEvent = {
     type:'run'|'wicket'|'wide'|'noball'|'bye'|'legbye',
     runs, extraRuns, isLegal, strikerId, bowlerId, wicketType, outPlayerId, newBatterId, over, ballInOver
   }
   ========================================================================== */

function getMatch(id){ return DB.matches.find(m=>m.id===id); }
function currentMatch(){ return getMatch(AppState.currentMatchId); }
function currentInnings(m){ return m.innings[m.currentInnings]; }

function newInnings(battingTeam,bowlingTeam,target){
  return {
    battingTeam, bowlingTeam,
    runs:0, wickets:0, balls:0,
    target: target||null,
    batters:{}, bowlers:{},
    battingOrder:[],
    strikerId:null, nonStrikerId:null, bowlerId:null, prevBowlerId:null,
    timeline:[],
    fallOfWickets:[],
    thisOverRuns:0,
    isComplete:false,
    extras:{wide:0,noball:0,bye:0,legbye:0,penalty:0}
  };
}

function ensureBatter(inn,playerId){
  if(!inn.batters[playerId]){
    inn.batters[playerId] = {runs:0,balls:0,fours:0,sixes:0,out:false,outType:null,bowlerId:null,fielderId:null,inAt:inn.balls,milestonesShown:[]};
    inn.battingOrder.push(playerId);
  }
  return inn.batters[playerId];
}
function ensureBowler(inn,playerId){
  if(!inn.bowlers[playerId]){
    inn.bowlers[playerId] = {balls:0,runs:0,wickets:0,maidens:0,runsThisOverArr:[]};
  }
  return inn.bowlers[playerId];
}

function playerName(id){
  const p = DB.players.find(pl=>pl.id===id);
  return p ? p.name : 'Unknown';
}
function teamOf(m,side){ return side==='A'?m.teamA:m.teamB; }
function squadOf(m,side){ return side==='A'?m.squadA:m.squadB; }

// Core: record a ball. params: {runs, extraType(null|wide|noball|bye|legbye), extraRuns, wicket(null|{type,outPlayerId,fielder})}
function recordBall(m, opts){
  const inn = currentInnings(m);
  if(inn.isComplete) return;
  const striker = inn.strikerId, bowler = inn.bowlerId;
  const bat = ensureBatter(inn,striker);
  const bwl = ensureBowler(inn,bowler);
  let isLegal = true;
  let totalRuns = opts.runs||0;
  let extraType = opts.extraType||null;
  let extraRuns = opts.extraRuns||0;

  if(extraType==='wide'){
    isLegal=false;
    const add = 1+extraRuns;
    inn.runs+=add; inn.extras.wide+=add; bwl.runs+=add;
  } else if(extraType==='noball'){
    isLegal=false;
    const add = 1+totalRuns;
    inn.runs+=add; inn.extras.noball+=1; bwl.runs+=add;
    if(totalRuns>0){ bat.runs+=totalRuns; if(totalRuns===4)bat.fours++; if(totalRuns===6)bat.sixes++; }
  } else if(extraType==='bye'){
    isLegal=true;
    inn.runs+=extraRuns; inn.extras.bye+=extraRuns; bat.balls++; bwl.balls++;
  } else if(extraType==='legbye'){
    isLegal=true;
    inn.runs+=extraRuns; inn.extras.legbye+=extraRuns; bat.balls++; bwl.balls++;
  } else {
    // normal run
    inn.runs+=totalRuns; bat.runs+=totalRuns; bat.balls++; bwl.balls++; bwl.runs+=totalRuns;
    if(totalRuns===4) bat.fours++;
    if(totalRuns===6) bat.sixes++;
  }

  let wicketFell=false, dismissedId=null;
  if(opts.wicket){
    wicketFell=true;
    dismissedId = opts.wicket.outPlayerId || striker;
    const db = inn.batters[dismissedId] || ensureBatter(inn,dismissedId);
    db.out=true; db.outType=opts.wicket.type; db.bowlerId=(opts.wicket.type==='runout')?null:bowler; db.fielderId=opts.wicket.fielderId||null;
    inn.wickets++;
    if(opts.wicket.type!=='runout') bwl.wickets++;
    inn.fallOfWickets.push({score:inn.runs, wicket:inn.wickets, over:fmtOvers(inn.balls+(isLegal?1:0),m.ballsPerOver), playerName:playerName(dismissedId)});
  }

  if(isLegal){ inn.balls++; }

  const ev = {
    type: opts.wicket ? 'wicket' : (extraType||'run'),
    runs: totalRuns, extraRuns, extraType, isLegal,
    strikerId:striker, bowlerId:bowler,
    wicket: opts.wicket||null, dismissedId,
    ballLabel: ballLabel(totalRuns,extraType,extraRuns,!!opts.wicket),
    ballsAfter: inn.balls
  };
  inn.timeline.push(ev);

  // strike rotation on odd runs (count total runs credited for rotation incl extras runs off bat on no-ball but not the no-ball penalty)
  const rotateRuns = (extraType==='bye'||extraType==='legbye') ? extraRuns : (extraType==='noball'? totalRuns : (extraType==='wide'? extraRuns : totalRuns));
  if(!opts.wicket && rotateRuns % 2 === 1){
    swapStrike(inn);
  }

  // wicket: need new batter (unless all out) - handled by caller via modal
  if(wicketFell && dismissedId===inn.strikerId){
    inn.strikerId=null; // caller must set new batter
  }

  // end of over
  if(isLegal && inn.balls % m.ballsPerOver === 0 && inn.balls>0){
    if(inn.strikerId && inn.nonStrikerId) swapStrike(inn);
    inn.prevBowlerId = bowler;
    inn.bowlerId = null; // caller must pick new bowler
  }

  checkInningsComplete(m);
  StorageManager.save();
  return ev;
}

function ballLabel(runs,extraType,extraRuns,isWicket){
  if(isWicket) return 'W';
  if(extraType==='wide') return 'Wd'+(extraRuns>0?'+'+extraRuns:'');
  if(extraType==='noball') return 'Nb'+(runs>0?'+'+runs:'');
  if(extraType==='bye') return extraRuns+'b';
  if(extraType==='legbye') return extraRuns+'lb';
  return String(runs);
}

function swapStrike(inn){
  const t = inn.strikerId; inn.strikerId = inn.nonStrikerId; inn.nonStrikerId = t;
}

function checkInningsComplete(m){
  const inn = currentInnings(m);
  const maxBalls = m.overs*m.ballsPerOver;
  const maxWkts = squadOf(m, inn.battingTeam).length - 1;
  if(inn.balls>=maxBalls || inn.wickets>=maxWkts){
    inn.isComplete = true;
  }
  if(inn.target!=null && inn.runs>=inn.target){
    inn.isComplete = true;
  }
}

function undoLastBall(m){
  const inn = currentInnings(m);
  if(inn.timeline.length===0){ toast('Nothing to undo'); return; }
  // Simplest robust approach: replay all events except the last one.
  const events = inn.timeline.slice(0,-1);
  const rebuilt = rebuildInningsFromEvents(m, inn, events);
  m.innings[m.currentInnings] = rebuilt;
  if(!inn.redoStack) inn.redoStack=[];
  rebuilt.redoStack = (inn.redoStack||[]).concat([inn.timeline[inn.timeline.length-1]]);
  StorageManager.save();
}
function redoLastBall(m){
  const inn = currentInnings(m);
  const stack = inn.redoStack||[];
  if(stack.length===0){ toast('Nothing to redo'); return; }
  const ev = stack[stack.length-1];
  const opts = {
    runs:ev.runs, extraType:ev.extraType, extraRuns:ev.extraRuns,
    wicket: ev.wicket
  };
  const savedStriker = inn.strikerId, savedBowler = inn.bowlerId;
  inn.strikerId = ev.strikerId; inn.bowlerId = ev.bowlerId;
  recordBall(m,opts);
  const newInn = currentInnings(m);
  newInn.redoStack = stack.slice(0,-1);
  StorageManager.save();
}
function rebuildInningsFromEvents(m, oldInn, events){
  const inn = newInnings(oldInn.battingTeam, oldInn.bowlingTeam, oldInn.target);
  inn.battingOrder = []; // will rebuild via ensureBatter calls
  // Need initial opening pair/bowler — stored separately
  inn._openStriker = oldInn._openStriker; inn._openNonStriker = oldInn._openNonStriker; inn._openBowler = oldInn._openBowler;
  inn.strikerId = oldInn._openStriker; inn.nonStrikerId = oldInn._openNonStriker; inn.bowlerId = oldInn._openBowler;
  events.forEach(ev=>{
    inn.strikerId = ev.strikerId; // ensure correct at time of ball (in case earlier over-change altered it externally)
    inn.bowlerId = ev.bowlerId;
    replayEvent(m, inn, ev);
  });
  // If the rebuilt innings lands exactly on a completed over, mirror recordBall's
  // behaviour: clear the bowler so the UI prompts for the next one.
  if(inn.balls>0 && inn.balls % m.ballsPerOver===0 && !inn.isComplete){
    inn.prevBowlerId = inn.bowlerId;
    inn.bowlerId = null;
  }
  return inn;
}
function replayEvent(m, inn, ev){
  // Mirrors recordBall's accounting logic without recursion/side effects on timeline duplication
  const striker=ev.strikerId, bowler=ev.bowlerId;
  const bat = ensureBatter(inn,striker);
  const bwl = ensureBowler(inn,bowler);
  let isLegal=true;
  if(ev.extraType==='wide'){ isLegal=false; const add=1+ev.extraRuns; inn.runs+=add; inn.extras.wide+=add; bwl.runs+=add; }
  else if(ev.extraType==='noball'){ isLegal=false; const add=1+ev.runs; inn.runs+=add; inn.extras.noball+=1; bwl.runs+=add; if(ev.runs>0){bat.runs+=ev.runs; if(ev.runs===4)bat.fours++; if(ev.runs===6)bat.sixes++;} }
  else if(ev.extraType==='bye'){ inn.runs+=ev.extraRuns; inn.extras.bye+=ev.extraRuns; bat.balls++; bwl.balls++; }
  else if(ev.extraType==='legbye'){ inn.runs+=ev.extraRuns; inn.extras.legbye+=ev.extraRuns; bat.balls++; bwl.balls++; }
  else { inn.runs+=ev.runs; bat.runs+=ev.runs; bat.balls++; bwl.balls++; bwl.runs+=ev.runs; if(ev.runs===4)bat.fours++; if(ev.runs===6)bat.sixes++; }

  if(ev.wicket){
    const dismissedId = ev.dismissedId;
    const db = inn.batters[dismissedId] || ensureBatter(inn,dismissedId);
    db.out=true; db.outType=ev.wicket.type; db.bowlerId=(ev.wicket.type==='runout')?null:bowler; db.fielderId=ev.wicket.fielderId||null;
    inn.wickets++;
    if(ev.wicket.type!=='runout') bwl.wickets++;
    inn.fallOfWickets.push({score:inn.runs, wicket:inn.wickets, over:fmtOvers(inn.balls+(isLegal?1:0),m.ballsPerOver), playerName:playerName(dismissedId)});
  }
  if(isLegal) inn.balls++;
  inn.timeline.push(ev);
  const rotateRuns = (ev.extraType==='bye'||ev.extraType==='legbye') ? ev.extraRuns : (ev.extraType==='noball'? ev.runs : (ev.extraType==='wide'? ev.extraRuns : ev.runs));
  if(!ev.wicket && rotateRuns%2===1) swapStrike(inn);
  if(ev.wicket && ev.dismissedId===inn.strikerId){ /* leave striker null-ish handled by caller in live flow; for replay keep as is if newBatterId known */ }
  if(isLegal && inn.balls % m.ballsPerOver===0 && inn.balls>0){ /* over end tracked but bowler reassignment is external, keep bowlerId as-is for replay since ev already encodes next bowler on subsequent events */ }
  checkInningsComplete(m);
}

function runRate(runs,balls){ return balls>0 ? (runs/(balls/6)).toFixed(2) : '0.00'; }
function requiredRunRate(target,runsSoFar,ballsBowled,totalBalls){
  const remaining = totalBalls-ballsBowled;
  const need = target-runsSoFar;
  if(remaining<=0) return '0.00';
  return ((need/remaining)*6).toFixed(2);
}

/* ---------------------------- HEAD-TO-HEAD RECORDS ---------------------------- */
function computeHeadToHead(teamAId, teamBId){
  const matches = DB.matches.filter(m=>m.status==='completed' &&
    ((m.teamA.id===teamAId && m.teamB.id===teamBId) || (m.teamA.id===teamBId && m.teamB.id===teamAId))
  ).sort((a,b)=>new Date(b.date)-new Date(a.date));
  let winsA=0, winsB=0, noResult=0, highestA=0, highestB=0;
  let biggestWin = null; // {winnerId, marginText}
  matches.forEach(m=>{
    m.innings.forEach(inn=>{
      const bId = teamOf(m,inn.battingTeam).id;
      if(bId===teamAId && inn.runs>highestA) highestA=inn.runs;
      if(bId===teamBId && inn.runs>highestB) highestB=inn.runs;
    });
    const r = m.result||{};
    if(!r.winner){ noResult++; return; }
    if(r.winner==='A' ? m.teamA.id===teamAId : m.teamB.id===teamAId) winsA++; else winsB++;
    const winnerTeamId = (r.winner==='A' ? m.teamA.id : m.teamB.id);
    const inn1 = m.innings[0], inn2 = m.innings[1];
    let marginText = r.text;
    if(!biggestWin){
      biggestWin = {winnerId:winnerTeamId, marginText};
    } else if(inn2 && inn1){
      // simple heuristic: prefer the match with the largest run/wicket margin mentioned in result text
      const num = parseInt((marginText.match(/\d+/)||['0'])[0],10);
      const prevNum = parseInt((biggestWin.marginText.match(/\d+/)||['0'])[0],10);
      if(num>prevNum) biggestWin = {winnerId:winnerTeamId, marginText};
    }
  });
  return { matches, totalMatches:matches.length, winsA, winsB, noResult, highestA, highestB, biggestWin };
}

const BATTING_STYLES = ['Right-hand bat','Left-hand bat'];
const BOWLING_STYLES = ['Right-arm fast','Right-arm medium','Right-arm off-spin','Right-arm leg-spin','Left-arm fast','Left-arm medium','Left-arm orthodox','Left-arm chinaman','None'];

function playerCareerStats(p){
  let runs=0,balls=0,fours=0,sixes=0,outs=0,innings=0,fifties=0,hundreds=0,highest=0;
  let bBalls=0,bRuns=0,bWkts=0,bMaidens=0,bestW=0,bestR=999;
  DB.matches.forEach(m=>{
    (m.innings||[]).forEach(inn=>{
      if(inn.batters[p.id]){
        const b=inn.batters[p.id];
        innings++; runs+=b.runs; balls+=b.balls; fours+=b.fours; sixes+=b.sixes;
        if(b.out) outs++;
        if(b.runs>highest) highest=b.runs;
        if(b.runs>=100) hundreds++; else if(b.runs>=50) fifties++;
      }
      if(inn.bowlers[p.id]){
        const bw=inn.bowlers[p.id];
        bBalls+=bw.balls; bRuns+=bw.runs; bWkts+=bw.wickets;
        if(bw.wickets>bestW || (bw.wickets===bestW && bw.runs<bestR)){ bestW=bw.wickets; bestR=bw.runs; }
      }
    });
  });
  return {runs,balls,fours,sixes,outs,innings,fifties,hundreds,highest,
    average:battingAverage(runs,outs), sr:strikeRate(runs,balls),
    bBalls,bRuns,bWkts,bMaidens,eco:economy(bRuns,bBalls),
    bestBowling: bWkts>0? bestW+'/'+bestR : '—'};
}

/* ==========================================================================
   PLAYER RANKING SYSTEM (additive — lives inside the existing Players section)
   Computed live from DB.matches; nothing new is persisted to storage.
   ========================================================================== */
const RANK_FILTERS = [
  {id:'all', label:'All-Time'},
  {id:'tournament', label:'Tournament'},
  {id:'series', label:'Series'},
  {id:'friendly', label:'Friendly'},
];
const RANK_CATEGORIES = [
  {id:'batting', label:'Batting'},
  {id:'bowling', label:'Bowling'},
  {id:'allrounder', label:'All-Rounder'},
];
const LEADERBOARD_CATEGORIES = [
  {id:'orangecap', label:'Orange Cap'},
  {id:'purplecap', label:'Purple Cap'},
  {id:'sixes', label:'Most 6s'},
  {id:'fours', label:'Most 4s'},
  {id:'bestsr', label:'Best SR'},
  {id:'besteconomy', label:'Best Econ'},
];
function matchInRankFilter(m, filterId){
  if(filterId==='all') return true;
  const t = m.tournamentId ? getTournament(m.tournamentId) : null;
  if(filterId==='friendly') return !t || t.type==='friendly';
  return !!t && t.type===filterId;
}
function computePlayerRankings(filterId, category){
  const matches = DB.matches.filter(m=>m.status==='completed' && matchInRankFilter(m, filterId));
  const agg = {};
  function get(pid){ if(!agg[pid]) agg[pid]={matchIds:new Set(), runs:0, balls:0, fours:0, sixes:0, outs:0, wkts:0, bRuns:0, bBalls:0}; return agg[pid]; }
  matches.forEach(m=>{
    [...m.squadA, ...m.squadB].forEach(pid=>get(pid).matchIds.add(m.id));
    m.innings.forEach(inn=>{
      Object.keys(inn.batters).forEach(pid=>{
        const b=inn.batters[pid], a=get(pid);
        a.runs+=b.runs; a.balls+=b.balls; a.fours+=b.fours; a.sixes+=b.sixes;
        if(b.out) a.outs++;
      });
      Object.keys(inn.bowlers).forEach(pid=>{
        const bw=inn.bowlers[pid], a=get(pid);
        a.wkts+=bw.wickets; a.bRuns+=bw.runs; a.bBalls+=bw.balls;
      });
    });
  });
  const rows = Object.keys(agg).map(pid=>{
    const a = agg[pid];
    const average = parseFloat(battingAverage(a.runs,a.outs));
    const sr = parseFloat(strikeRate(a.runs,a.balls));
    const eco = parseFloat(economy(a.bRuns,a.bBalls));
    const battingRating = (a.runs*1.0)+(average*1.5)+(sr*0.5);
    const bowlingRating = (a.wkts*20)-(eco*3);
    const allRounderRating = (battingRating*0.5)+(bowlingRating*0.5);
    return {
      pid, name:playerName(pid), matches:a.matchIds.size,
      runs:a.runs, wickets:a.wkts, fours:a.fours, sixes:a.sixes, balls:a.balls, bBalls:a.bBalls,
      sr:sr.toFixed(1), eco:eco.toFixed(2),
      battingRating, bowlingRating, allRounderRating
    };
  });
  const LB_MIN_BALLS = 6;
  let result = rows;
  let key = 'battingRating';
  if(category==='batting') key='battingRating';
  else if(category==='bowling') key='bowlingRating';
  else if(category==='allrounder') key='allRounderRating';
  else if(category==='orangecap') key='runs';
  else if(category==='purplecap') key='wickets';
  else if(category==='sixes') key='sixes';
  else if(category==='fours') key='fours';
  else if(category==='bestsr'){ key='sr'; result = rows.filter(r=>r.balls>=LB_MIN_BALLS); }
  else if(category==='besteconomy'){ key='eco'; result = rows.filter(r=>r.bBalls>=LB_MIN_BALLS); }
  if(category==='besteconomy'){ result = result.slice().sort((x,y)=>parseFloat(x.eco)-parseFloat(y.eco)); }
  else if(category==='bestsr'){ result = result.slice().sort((x,y)=>parseFloat(y.sr)-parseFloat(x.sr)); }
  else { result = result.slice().sort((x,y)=>y[key]-x[key]); }
  return {rows:result, key};
}

  const filter = AppState.rankFilter || 'all';

  const isLeaderboard = LEADERBOARD_CATEGORIES.some(c=>c.id===category);

  const simpleKey = {orangecap:'runs', purplecap:'wickets', sixes:'sixes', fours:'fours', bestsr:'sr', besteconomy:'eco'}[category];

    ${rows.slice(0,25).map((r,i)=>`<tr class="${i===0?'current-row':''}" data-action="open-player" data-id="${r.pid}" style="cursor:pointer"><td>${i+1}</td><td>${esc(r.name)}</td><td><b>${Math.round(r[key])}</b></td><td>${r.matches}</td><td>${r.runs}</td><td>${r.wickets}</td><td>${r.sr}</td><td>${r.eco}</td></tr>`).join('')}
  </table></div>
  <p style="font-size:11px;color:var(--clr-text-dim);margin:10px 2px 0">Rating is a composite score (runs, average, strike rate for batting; wickets and economy for bowling) used purely for ranking, recalculated live from completed matches.</p>
  `}
  `;
}

function teamNameOrDefault(id,fallback){ const t=DB.teams.find(x=>x.id===id); return t?t.name:fallback; }

/* ==========================================================================
   SMART TOSS (additive)
   A 3D animated coin-flip flow that determines the toss winner and feeds the
   result straight into the same draft.tossWinner / draft.tossChoice fields
   the existing manual chips already use — so the existing Toss Won By /
   Elected To UI stays fully functional on its own, and this is just a nicer
   way to fill it in. Also keeps a lightweight Toss History (derived from
   matches already in DB.matches — no separate store to go stale).
   ========================================================================== */
function smartTossCancelLink(){
  return `<button data-action="dismiss-sheet" style="position:absolute;top:14px;right:18px;background:none;border:none;color:var(--clr-text-dim);font-size:13px;font-weight:700;cursor:pointer">Cancel</button>`;
}
function smartTossStepHTML(state, d){
  if(state.step==='caller'){
    return `
      ${smartTossCancelLink()}
      <h2>🪙 Smart Toss</h2>
      <p style="font-size:12.5px;color:var(--clr-text-dim);margin:-8px 0 14px">Who's calling the toss?</p>
      <div class="chip-row" id="stCallerRow">
        <span class="chip ${state.caller==='A'?'active':''}" data-st-caller="A">${esc(teamNameOrDefault(d.teamAId,'Team A'))}</span>
        <span class="chip ${state.caller==='B'?'active':''}" data-st-caller="B">${esc(teamNameOrDefault(d.teamBId,'Team B'))}</span>
      </div>
      <button class="btn btn-primary btn-block" style="margin-top:16px" id="stNextBtn" ${state.caller?'':'disabled'}>Next</button>
    `;
  }
  if(state.step==='call'){
    const callerName = teamNameOrDefault(state.caller==='A'?d.teamAId:d.teamBId, 'Team '+state.caller);
    return `
      ${smartTossCancelLink()}
      <h2>🪙 Smart Toss</h2>
      <p style="font-size:12.5px;color:var(--clr-text-dim);margin:-8px 0 14px">${esc(callerName)} calls it in the air —</p>
      <div class="chip-row" id="stCallRow">
        <span class="chip ${state.call==='heads'?'active':''}" data-st-call="heads">Heads</span>
        <span class="chip ${state.call==='tails'?'active':''}" data-st-call="tails">Tails</span>
      </div>
      <button class="btn btn-primary btn-block" style="margin-top:16px" id="stNextBtn" ${state.call?'':'disabled'}>Flip the Coin</button>
    `;
  }
  if(state.step==='flip'){
    return `
      ${smartTossCancelLink()}
      <h2 style="text-align:center">🪙 Smart Toss</h2>
      <div class="coin-3d-stage">
        <div class="coin-3d" id="stCoin">
          <div class="coin-face coin-front"><span class="coin-icon">👑</span><span class="coin-label">HEADS</span></div>
          <div class="coin-face coin-back"><span class="coin-icon">🏏</span><span class="coin-label">TAILS</span></div>
        </div>
      </div>
      <p id="stResultText" style="text-align:center;font-weight:700;font-size:15px;min-height:22px;margin:6px 0 16px"></p>
      <button class="btn btn-accent btn-block" id="stFlipBtn">Flip!</button>
      <button class="btn btn-primary btn-block hidden" id="stContinueBtn" style="margin-top:10px">Continue</button>
    `;
  }
  if(state.step==='choice'){
    const winnerName = teamNameOrDefault(state.winner==='A'?d.teamAId:d.teamBId, 'Team '+state.winner);
    return `
      ${smartTossCancelLink()}
      <h2 style="text-align:center">🎉 ${esc(winnerName)} won the toss!</h2>
      <p style="font-size:12.5px;color:var(--clr-text-dim);text-align:center;margin:-6px 0 16px">Coin landed on ${state.result==='heads'?'Heads':'Tails'} — ${state.call===state.result?'matched the call':'call was wrong, other side wins'}.</p>
      <label style="font-size:12.5px;font-weight:700;color:var(--clr-text-dim);display:block;margin-bottom:8px;text-align:center">Elected to</label>
      <div class="chip-row" id="stChoiceRow" style="justify-content:center">
        <span class="chip accent ${state.choice==='bat'?'active':''}" data-st-choice="bat">Bat</span>
        <span class="chip accent ${state.choice==='bowl'?'active':''}" data-st-choice="bowl">Bowl</span>
      </div>
      <button class="btn btn-primary btn-block" style="margin-top:18px" id="stConfirmBtn" ${state.choice?'':'disabled'}>Confirm &amp; Continue</button>
    `;
  }
}
function openSmartTossSheet(){
  const d = ensureDraft();
  const state = { step:'caller', caller:null, call:null, result:null, winner:null, choice:null };
  const rerender = ()=>{ $('.sheet').innerHTML = '<div class="sheet-handle"></div>' + smartTossStepHTML(state, d); bindStep(); };
  function bindStep(){
    if(state.step==='caller'){
      $('#stCallerRow').addEventListener('click', e=>{
        const chip = e.target.closest('[data-st-caller]'); if(!chip) return;
        state.caller = chip.dataset.stCaller; rerender();
      });
      const nb = $('#stNextBtn'); if(nb) nb.onclick = ()=>{ if(state.caller){ state.step='call'; rerender(); } };
    } else if(state.step==='call'){
      $('#stCallRow').addEventListener('click', e=>{
        const chip = e.target.closest('[data-st-call]'); if(!chip) return;
        state.call = chip.dataset.stCall; rerender();
      });
      const nb = $('#stNextBtn'); if(nb) nb.onclick = ()=>{ if(state.call){ state.step='flip'; rerender(); } };
    } else if(state.step==='flip'){
      $('#stFlipBtn').onclick = ()=>{
        const coin = $('#stCoin');
        const result = Math.random()<0.5 ? 'heads' : 'tails';
        state.result = result;
        coin.classList.remove('spinning','land-tails');
        void coin.offsetWidth;
        coin.classList.add('spinning');
        if(result==='tails') coin.classList.add('land-tails');
        $('#stFlipBtn').disabled = true;
        vibrate([15,30,15,30,40]);
        setTimeout(()=>{
          state.winner = (state.call===result) ? state.caller : (state.caller==='A'?'B':'A');
          $('#stResultText').textContent = 'Landed on '+(result==='heads'?'Heads 👑':'Tails 🏏');
          $('#stFlipBtn').classList.add('hidden');
          $('#stContinueBtn').classList.remove('hidden');
        }, 1750);
      };
      $('#stContinueBtn').onclick = ()=>{ state.step='choice'; rerender(); };
    } else if(state.step==='choice'){
      $('#stChoiceRow').addEventListener('click', e=>{
        const chip = e.target.closest('[data-st-choice]'); if(!chip) return;
        state.choice = chip.dataset.stChoice; rerender();
      });
      const cb = $('#stConfirmBtn'); if(cb) cb.onclick = ()=>{
        if(!state.choice) return;
        d.tossWinner = state.winner;
        d.tossChoice = state.choice;
        d.smartTossUsed = { caller:state.caller, call:state.call, coinResult:state.result };
        closeOverlay();
        render();
        toast('Toss set from Smart Toss');
      };
    }
  }
  openSheet('', {persistent:true});
  rerender();
}

function validateAndCreateMatch(){
  const d = AppState.newMatchDraft;
  if(!d.teamAId || !d.teamBId){ toast('Select both teams'); return; }
  if(d.teamAId===d.teamBId){ toast('Teams must be different'); return; }
  if(d.customOvers){
    const customVal = parseInt($('#customOversInput')?.value,10);
    if(!customVal || customVal<1){ toast('Enter a valid custom overs number'); return; }
    d.overs = customVal;
  }
  const teamA = DB.teams.find(t=>t.id===d.teamAId), teamB = DB.teams.find(t=>t.id===d.teamBId);
  if(teamA.playingXI.length<2 || teamB.playingXI.length<2){ toast('Each team needs at least 2 players in Playing XI'); return; }
  const battingFirst = (d.tossChoice==='bat') ? d.tossWinner : (d.tossWinner==='A'?'B':'A');
  const bowlingFirst = battingFirst==='A'?'B':'A';
  const match = {
    id: uid('m'), title: teamA.name+' vs '+teamB.name,
    venue:d.venue, date:d.date, scorer:d.scorer, umpire:d.umpire,
    overs:d.overs, ballsPerOver:d.ballsPerOver,
    teamA:{id:teamA.id,name:teamA.name,color:teamA.color}, teamB:{id:teamB.id,name:teamB.name,color:teamB.color},
    squadA:teamA.playingXI.slice(), squadB:teamB.playingXI.slice(),
    tossWinner:d.tossWinner, tossChoice:d.tossChoice,
    status:'live', result:null,
    innings:[ newInnings(battingFirst,bowlingFirst,null) ],
    currentInnings:0,
    tournamentId: d.tournamentId || null,
    tossPredictions: d.tossPredictions.slice(), coinResult: d.coinResult,
    smartTossUsed: d.smartTossUsed || null,
    impactPlayerA: d.impactPlayerA || null, impactPlayerB: d.impactPlayerB || null,
    impactPlayerUsed: { A:null, B:null }
  };
  DB.matches.push(match);
  schLinkCreatedMatch(match, d);
  if(AppState.activeFixtureSlot){
    const fs = AppState.activeFixtureSlot;
    const tt = getTournament(fs.tournamentId);
    const slot = tt && (tt.fixtureSlots||[]).find(x=>x.id===fs.slotId);
    if(slot) slot.matchId = match.id;
    AppState.activeFixtureSlot = null;
  }
  StorageManager.save();
  AppState.currentMatchId = match.id;
  AppState.newMatchDraft = null;
  const tossWinnerName = teamOf(match, match.tossWinner).name;
  notify('toss', 'Toss Result', tossWinnerName+' won the toss and elected to '+match.tossChoice, {matchId:match.id});
  if(match.tossPredictions.length){
    const winners = match.tossPredictions.filter(p=>p.guess===match.coinResult).map(p=>p.name);
    notify('toss', 'Toss Prediction Results', (match.coinResult?'Coin landed '+match.coinResult+'. ':'')+(winners.length?'Correct: '+winners.join(', '):'Nobody guessed right!'), {matchId:match.id});
  }
  logTimeline(match, 'toss', tossWinnerName+' won the toss, elected to '+match.tossChoice);
  openSelectOpenersFlow(match);
}

function liveScreenHTML(){

  if(m.status==='completed' || m.status==='abandoned'){
    return matchResultHTML(m);
  }
  if(m.locked){
    return `<div class="card" style="text-align:center;padding:36px 20px">
      <div style="font-size:44px;margin-bottom:10px">🔒</div>

      <p style="font-size:13px;color:var(--clr-text-dim);margin:0 0 18px">Scoring is paused to prevent accidental taps. Enter the PIN to continue.</p>

    </div>`;
  }
  const inn = currentInnings(m);
  const battingTeam = teamOf(m,inn.battingTeam), bowlingTeam = teamOf(m,inn.bowlingTeam);
  const maxBalls = m.overs*m.ballsPerOver;
  const crr = runRate(inn.runs, inn.balls);
  const striker = inn.strikerId ? (inn.batters[inn.strikerId]||{runs:0,balls:0}) : null;
  const nonStriker = inn.nonStrikerId ? (inn.batters[inn.nonStrikerId]||{runs:0,balls:0}) : null;
  const bowler = inn.bowlerId ? (inn.bowlers[inn.bowlerId]||{balls:0,runs:0,wickets:0}) : null;

  const lastBalls = inn.timeline.slice(-12);

  let targetBlock = '';
  if(inn.target!=null){
    const need = Math.max(0, inn.target - inn.runs);
    const ballsLeft = maxBalls - inn.balls;
    const rrr = requiredRunRate(inn.target, inn.runs, inn.balls, maxBalls);
    targetBlock = `<div class="target-line">Target ${inn.target} · Need <b>${need}</b> run${need!==1?'s':''} from <b>${Math.max(0,ballsLeft)}</b> ball${ballsLeft!==1?'s':''} · RRR ${rrr}</div>`;

  const needsOpeners = !inn.strikerId || !inn.nonStrikerId;
  const needsBowler = !inn.bowlerId;

  let totalFours=0, totalSixes=0;
  Object.values(inn.batters).forEach(b=>{ totalFours+=b.fours; totalSixes+=b.sixes; });

  return `
  <div class="score-hero" id="scoreHero">
    <div class="teams-line"><span><span class="dot" style="background:${esc(battingTeam.color||'#fff')};display:inline-block;margin-right:5px;vertical-align:middle"></span>${esc(battingTeam.name)} batting</span><span>vs ${esc(bowlingTeam.name)}</span></div>
    <div class="score-big"><span class="runs" id="bigScore">${inn.runs}/${inn.wickets}</span><span class="overs">(${fmtOvers(inn.balls,m.ballsPerOver)}/${m.overs} ov)</span></div>
    <div class="score-meta">
      <div><span>${crr}</span><em>CRR</em></div>
      ${inn.target!=null?`<div><span>${requiredRunRate(inn.target,inn.runs,inn.balls,maxBalls)}</span><em>RRR</em></div>`:''}
      <div><span>${totalFours}</span><em>4s</em></div>
      <div><span>${totalSixes}</span><em>6s</em></div>
      <div><span>${boundaryPct}%</span><em>Boundary %</em></div>
    </div>
    ${targetBlock}
  </div>
  ${cbxSummaryHTML(m)}
  ${wpHTML(m)}

  <div class="batters-box">
    <div class="player-pill" data-action="open-more-menu"><div class="pn"><span class="dot"></span>${striker?esc(playerName(inn.strikerId)):'Select striker'}</div><div class="pr">${striker?`${striker.runs} (${striker.balls}) · SR ${strikeRate(striker.runs,striker.balls)}`:'—'}</div></div>
    <div class="player-pill"><div class="pn">${nonStriker?esc(playerName(inn.nonStrikerId)):'Select non-striker'}</div><div class="pr">${nonStriker?`${nonStriker.runs} (${nonStriker.balls})`:'—'}</div></div>
  </div>
  <div class="player-pill bowler-pill">
    <div class="pn">◎ ${bowler?esc(playerName(inn.bowlerId)):'Select bowler'}</div>
    <div class="pr">${bowler?`${fmtOvers(bowler.balls,m.ballsPerOver)} ov · ${bowler.runs} runs · ${bowler.wickets} wkt${bowler.wickets!==1?'s':''} · Econ ${economy(bowler.runs,bowler.balls)}`:'—'}</div>
  </div>

  <div class="section-title" style="margin-top:18px">This over</div>
  <div class="over-strip">
    ${lastBalls.length? lastBalls.map(ev=>ballChipHTML(ev)).join('') : `<span style="font-size:12.5px;color:var(--clr-text-dim)">No balls bowled yet</span>`}

function ballChipHTML(ev){
  let cls='';

  else if(ev.extraType) cls='extra';
  return `<div class="ball-chip ${cls}">${esc(ev.ballLabel)}</div>`;
}

function dismissalText(inn,pid){
  const b = inn.batters[pid];
  if(!b.out) return '';
  const map = {bowled:'b',caught:'c',lbw:'lbw b',runout:'run out',stumped:'st',hitwicket:'hit wicket',retired:'retired out'};
  if(b.outType==='runout') return 'run out';
  if(b.outType==='caught') return `c ${b.fielderId?esc(playerName(b.fielderId)):'fielder'} b ${esc(playerName(b.bowlerId))}`;
  if(b.outType==='stumped') return `st ${b.fielderId?esc(playerName(b.fielderId)):'wk'} b ${esc(playerName(b.bowlerId))}`;
  if(b.outType==='retired') return 'retired out';
  return `${map[b.outType]||b.outType} ${esc(playerName(b.bowlerId))}`;
}

/* ==========================================================================
