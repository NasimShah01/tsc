   ========================================================================== */
function openSheet(innerHTML, opts={}){
  const root = $('#overlayRoot');
  root.innerHTML = `<div class="overlay ${opts.center?'dialog-center':''}" id="activeOverlay">
    ${opts.center? `<div class="dialog-box">${innerHTML}</div>` : `<div class="sheet"><div class="sheet-handle"></div>${innerHTML}</div>`}
  </div>`;
  const overlay = $('#activeOverlay');
  requestAnimationFrame(()=>overlay.classList.add('open'));
  overlay.addEventListener('click',e=>{ if(e.target===overlay && !opts.persistent) closeOverlay(); });
  attachRipple(root);
  return overlay;
}
function closeOverlay(){
  const overlay = $('#activeOverlay');
  if(!overlay) return;
  overlay.classList.remove('open');
  setTimeout(()=>{
    // Only clear the overlay root if this exact sheet is still the one showing.
    // If a new sheet was opened in the meantime (e.g. striker -> non-striker ->
    // bowler chains, or the wicket flow), this stale timer must NOT wipe it out.
    if($('#overlayRoot').firstElementChild === overlay){
      $('#overlayRoot').innerHTML='';
    }
  }, 220);
}
function showConfirm(title, message, confirmLabel, onConfirm, danger=true){

function availableBatters(m, inn){
  const squad = squadOf(m, inn.battingTeam);
  return squad.filter(pid=>{
    const b = inn.batters[pid];
    return !b || !b.out;
  }).filter(pid=> pid!==inn.strikerId && pid!==inn.nonStrikerId);
}
function availableBowlers(m, inn){
  const squad = squadOf(m, inn.bowlingTeam);
  return squad.filter(pid=> pid!==inn.prevBowlerId);
}

function openSelectOpenersFlow(m){
  pushScreen('live');
  const inn = currentInnings(m);
  const squad = squadOf(m, inn.battingTeam);
  playerPickerSheet('Select Striker', squad, (strikerId)=>{
    inn.strikerId = strikerId;
    ensureBatter(inn,strikerId);
    const remaining = squad.filter(p=>p!==strikerId);
    playerPickerSheet('Select Non-Striker', remaining, (nonStrikerId)=>{
      inn.nonStrikerId = nonStrikerId;
      ensureBatter(inn,nonStrikerId);
      inn._openStriker = strikerId; inn._openNonStriker = nonStrikerId;
      const bowlSquad = squadOf(m, inn.bowlingTeam);
      playerPickerSheet('Select Opening Bowler', bowlSquad, (bowlerId)=>{
        inn.bowlerId = bowlerId; inn._openBowler = bowlerId;
        ensureBowler(inn,bowlerId);
        StorageManager.save();
        render();
        toast('Match is live!');
        if(m.currentInnings===0){
          notify('matchStart', 'Match Started', teamOf(m,'A').name+' vs '+teamOf(m,'B').name+' is now live', {matchId:m.id});
        }
      });
    });
  });
}

function handleRunTap(runs){
  const m = currentMatch(); if(!m) return;
  const inn = currentInnings(m);
  if(!inn.strikerId || !inn.nonStrikerId || !inn.bowlerId) return;
  recordBall(m,{runs});
  postBallUpdate(m, runs===4?'four':runs===6?'six':null);
}
function handleExtraTap(extraType){
  const m = currentMatch(); if(!m) return;
  const inn = currentInnings(m);
  if(!inn.strikerId || !inn.nonStrikerId || !inn.bowlerId) return;
  if(extraType==='wide' || extraType==='noball'){
    openExtraRunsSheet(extraType, (extraRuns, batRuns)=>{
      recordBall(m, extraType==='wide' ? {extraType,extraRuns} : {runs:batRuns, extraType, extraRuns:0});
      postBallUpdate(m,null);
    });
  } else {
    openExtraRunsSheet(extraType, (extraRuns)=>{
      recordBall(m, {extraType, extraRuns});
      postBallUpdate(m,null);
    });
  }
}
function openExtraRunsSheet(extraType, cb){
  const isNoBall = extraType==='noball';
  const label = {wide:'Wide',noball:'No Ball',bye:'Bye',legbye:'Leg Bye'}[extraType];
  const opts = isNoBall ? [0,1,2,3,4,6] : [0,1,2,3,4,5];
  openSheet(`
    <h2>${label} — runs</h2>
    <div class="chip-row">
      ${opts.map(n=>`<span class="chip" data-extra-run="${n}">${isNoBall?(n===0?'No runs':n+' run off bat'):n}</span>`).join('')}
    </div>
  `);
  $('#activeOverlay').addEventListener('click',e=>{
    const chip = e.target.closest('[data-extra-run]');
    if(!chip) return;
    const n = parseInt(chip.dataset.extraRun,10);
    closeOverlay();
    if(extraType==='wide') cb(n);
    else if(isNoBall) cb(0,n);
    else cb(n);
  });
}
function postBallUpdate(m, flashType){
  const inn = currentInnings(m);
  const strikerNameForLog = inn.strikerId ? playerName(inn.strikerId) : null;
  if(flashType==='four') logTimeline(m, 'boundary', strikerNameForLog+' hits a FOUR');
  if(flashType==='six') logTimeline(m, 'six', strikerNameForLog+' hits a SIX');
  if(inn.balls>0 && inn.balls % m.ballsPerOver===0 && !inn.isComplete){
    logTimeline(m, 'overEnd', 'End of over '+Math.floor(inn.balls/m.ballsPerOver)+' — '+inn.runs+'/'+inn.wickets);
  }
  handleInningsProgress(m);
  render();
  const hero = $('#scoreHero');
  if(hero){
    hero.classList.remove('flash-boundary','flash-six');
    if(flashType==='four'){ void hero.offsetWidth; hero.classList.add('flash-boundary'); vibrate(15); }
    if(flashType==='six'){ void hero.offsetWidth; hero.classList.add('flash-six'); vibrate([15,30,15]); }
  }
  const bigScore = $('#bigScore');
  if(bigScore){ bigScore.classList.add('score-pulse'); setTimeout(()=>bigScore.classList.remove('score-pulse'),350); }
  checkMilestones(m);
}

/* ==========================================================================
   BATTER & PARTNERSHIP MILESTONES (additive)
   ========================================================================== */
const BATTER_MILESTONES = [25,50,75,100,125,150,175,200];
const PARTNERSHIP_MILESTONES = [50,100,150,200];
function currentPartnershipRuns(m, inn){
  const fow = inn.fallOfWickets;
  const baseline = fow.length ? fow[fow.length-1].score : 0;
  return inn.runs - baseline;
}
function checkMilestones(m){
  if(!DB.settings.boundaryMilestones) return;
  const inn = currentInnings(m);
  if(inn.isComplete) return;
  [inn.strikerId, inn.nonStrikerId].forEach(pid=>{
    if(!pid) return;
    const b = inn.batters[pid];
    if(!b) return;
    if(!b.milestonesShown) b.milestonesShown=[];
    BATTER_MILESTONES.forEach(ms=>{
      if(b.runs>=ms && !b.milestonesShown.includes(ms)){
        b.milestonesShown.push(ms);
        celebrateMilestone(ms+'! '+playerName(pid), ms>=100?'century':'fifty');
        logTimeline(m, 'milestone', playerName(pid)+' reaches '+ms+' runs');
      }
    });
  });
  if(!inn.partnershipMilestonesShown) inn.partnershipMilestonesShown=[];
  const pRuns = currentPartnershipRuns(m, inn);
  PARTNERSHIP_MILESTONES.forEach(ms=>{
    if(pRuns>=ms && !inn.partnershipMilestonesShown.includes(ms)){
      inn.partnershipMilestonesShown.push(ms);
      celebrateMilestone(ms+' Partnership!', 'partnership');
      logTimeline(m, 'milestone', ms+' run partnership between '+(inn.strikerId?playerName(inn.strikerId):'')+' &amp; '+(inn.nonStrikerId?playerName(inn.nonStrikerId):''));
    }
  });
  StorageManager.save();
}
function celebrateMilestone(text, kind){
  if(!DB.settings.celebrationEffects) return;
  const wrap = document.createElement('div');
  wrap.className = 'milestone-card';
  wrap.innerHTML = `<div class="milestone-emoji">${kind==='century'?'💯':kind==='partnership'?'🤝':'🎉'}</div><div class="milestone-text">${esc(text)}</div>`;
  document.body.appendChild(wrap);
  vibrate([20,40,20,40,20]);
  setTimeout(()=>{ wrap.classList.add('milestone-out'); setTimeout(()=>wrap.remove(),400); }, 2200);
}

/* ==========================================================================
   MATCH TIMELINE (additive)
   A match-wide, chronological event log — toss, boundaries, wickets, over
   ends, innings ends, ball changes, milestones, penalty runs, DLS updates,
   super over and the result all feed into m.matchTimeline. Every existing
   flow that already does these things (recordBall, finishMatch, etc.) is
   left exactly as-is; this only ADDS a log call alongside them.
   ========================================================================== */
function ensureMatchTimeline(m){ if(!m.matchTimeline) m.matchTimeline=[]; return m.matchTimeline; }
function logTimeline(m, type, text){
  const list = ensureMatchTimeline(m);
  const inn = m.innings && m.innings.length ? currentInnings(m) : null;
  list.push({ type, text, ts:new Date().toISOString(), over: inn ? fmtOvers(inn.balls, m.ballsPerOver) : null, inningsIdx: m.currentInnings });
}
const TIMELINE_ICONS = {
  toss:'🪙', boundary:'🏏', six:'🚀', wicket:'✖️', overEnd:'🔵', inningsEnd:'⏸️',
  ballChange:'⚫', milestone:'🎉', penalty:'⚠️', dls:'🌧️', superOver:'⚡', result:'🏆', umpire:'📝', impactPlayer:'🔄'
};

/* ==========================================================================
   IMPACT PLAYER (additive — BPL/IPL style)
   The nominated player was already added to the match at setup time
   (match.impactPlayerA / impactPlayerB, from that team's bench). Using it
   just swaps one id out of match.squadA/squadB for the nominee. Every
   existing flow that reads the squad — batting order, bowler selection,
   new-batter picker, scorecard, career stats, rankings — already reads
   straight from squadOf(m, side) / inn.batters / inn.bowlers, so nothing
   else needs to change for the substitution to take full effect.
   ========================================================================== */
function impactPlayerEligibleSides(m){
  if(!m || m.status!=='live') return [];
  const sides = [];
  const used = m.impactPlayerUsed || {A:null,B:null};
  if(m.impactPlayerA && !used.A) sides.push('A');
  if(m.impactPlayerB && !used.B) sides.push('B');
  return sides;
}
function openImpactPlayerSheet(m){
  const sides = impactPlayerEligibleSides(m);
  if(!sides.length){ toast('No Impact Player available'); return; }
  if(sides.length===1){ openImpactPlayerPickOutSheet(m, sides[0]); return; }
  openSheet(`
    <h2>Impact Player</h2>
    <p style="font-size:12.5px;color:var(--clr-text-dim);margin:-8px 0 14px">Which team is bringing on their Impact Player?</p>
    <div class="option-list">
      ${sides.map(side=>`<div class="option-item" data-ip-side="${side}"><span class="oi-icon">🔄</span>${esc(teamOf(m,side).name)} — ${esc(playerName(side==='A'?m.impactPlayerA:m.impactPlayerB))}</div>`).join('')}
    </div>
  `);
  $('#activeOverlay').addEventListener('click', e=>{
    const item = e.target.closest('[data-ip-side]'); if(!item) return;
    const side = item.dataset.ipSide;
    closeOverlay();
    openImpactPlayerPickOutSheet(m, side);
  });
}
function openImpactPlayerPickOutSheet(m, side){
  const nomineeId = side==='A' ? m.impactPlayerA : m.impactPlayerB;
  const inn = m.innings && m.innings.length ? currentInnings(m) : null;
  const currentSquad = squadOf(m, side);
  // Guard against pulling out whoever's actively at the crease or bowling right now —
  // that would leave the live innings without a valid striker/non-striker/bowler.
  const locked = new Set();
  if(inn && inn.battingTeam===side){ if(inn.strikerId) locked.add(inn.strikerId); if(inn.nonStrikerId) locked.add(inn.nonStrikerId); }
  if(inn && inn.bowlingTeam===side){ if(inn.bowlerId) locked.add(inn.bowlerId); }
  const candidates = currentSquad.filter(pid=>pid!==nomineeId && !locked.has(pid));
  openSheet(`
    <h2>Impact Player — ${esc(teamOf(m,side).name)}</h2>
    <p style="font-size:12.5px;color:var(--clr-text-dim);margin:-8px 0 14px">${esc(playerName(nomineeId))} comes in for — who goes out?</p>
    <div id="ipOutList">
      ${candidates.length? candidates.map(pid=>`<div class="player-select-item" data-pid="${pid}"><span>${esc(playerName(pid))}</span></div>`).join('') : `<p style="font-size:13px;color:var(--clr-text-dim)">Everyone left is currently batting or bowling — try again once the over/innings moves on.</p>`}
    </div>
  `);
  $('#ipOutList')?.addEventListener('click', e=>{
    const item = e.target.closest('.player-select-item'); if(!item) return;
    const outId = item.dataset.pid;
    closeOverlay();
    showConfirm('Confirm Impact Player', esc(playerName(nomineeId))+' will replace '+esc(playerName(outId))+' for the rest of the match.', 'Confirm Substitution', ()=>{
      applyImpactPlayerSubstitution(m, side, outId, nomineeId);
    });
  });
}
function applyImpactPlayerSubstitution(m, side, outId, inId){
  const squad = squadOf(m, side);
  const idx = squad.indexOf(outId);
  if(idx===-1){ toast('Player not found in current squad'); return; }
  squad[idx] = inId;
  if(!m.impactPlayerUsed) m.impactPlayerUsed = {A:null,B:null};
  m.impactPlayerUsed[side] = { outPlayerId:outId, inPlayerId:inId, atOver: m.innings && m.innings.length ? fmtOvers(currentInnings(m).balls, m.ballsPerOver) : null };
  logTimeline(m, 'impactPlayer', esc(playerName(inId))+' comes on as Impact Player for '+esc(teamOf(m,side).name)+', replacing '+esc(playerName(outId)));
  notify('matchResult', 'Impact Player Used', playerName(inId)+' replaces '+playerName(outId)+' for '+teamOf(m,side).name, {matchId:m.id});
  StorageManager.save();
  render();
  toast('Impact Player substitution made');
}

function applyPenaltyRuns(m, runs){

}

function openWicketSheet(){
  const m = currentMatch(); if(!m) return;
  const inn = currentInnings(m);
  if(!inn.strikerId || !inn.bowlerId){ toast('Select players first'); return; }
  const types = [
    {id:'bowled',label:'Bowled'},{id:'caught',label:'Caught'},{id:'lbw',label:'LBW'},
    {id:'runout',label:'Run Out'},{id:'stumped',label:'Stumped'},{id:'hitwicket',label:'Hit Wicket'},{id:'retired',label:'Retired Out'}
  ];
  openSheet(`
    <h2>How was the batter out?</h2>
    <div class="option-list">
      ${types.map(t=>`<div class="option-item danger" data-wicket-type="${t.id}"><span class="oi-icon">W</span>${t.label}</div>`).join('')}
    </div>
  `);
  $('#activeOverlay').addEventListener('click',e=>{
    const item = e.target.closest('[data-wicket-type]');
    if(!item) return;
    const type = item.dataset.wicketType;
    closeOverlay();
    proceedWicket(m, inn, type);
  });
}
function proceedWicket(m, inn, type){
  if(type==='runout'){
    playerPickerSheet('Who was run out?', [inn.strikerId, inn.nonStrikerId], (outId)=>{
      finalizeWicket(m, inn, type, outId, null);
    }, pid=>pid===inn.strikerId?'Striker':'Non-striker');
    return;
  }
  if(type==='caught' || type==='stumped'){
    const fielders = squadOf(m, inn.bowlingTeam);
    playerPickerSheet(type==='caught'?'Caught by':'Stumped by', fielders, (fielderId)=>{
      finalizeWicket(m, inn, type, inn.strikerId, fielderId);
    });
    return;
  }
  finalizeWicket(m, inn, type, inn.strikerId, null);
}
function finalizeWicket(m, inn, type, outId, fielderId){
  const wasStriker = outId===inn.strikerId;
  const outPlayerName = playerName(outId);
  recordBall(m, {runs:0, wicket:{type,outPlayerId:outId,fielderId}});
  logTimeline(m, 'wicket', outPlayerName+' is out ('+type+') — '+currentInnings(m).runs+'/'+currentInnings(m).wickets);
  const refreshedInn = currentInnings(m);
  if(refreshedInn.isComplete){
    render();
    const hero=$('#scoreHero'); if(hero){ hero.classList.add('flash-wicket'); }
    handleInningsProgress(m);
    return;
  }
  const remaining = availableBatters(m, refreshedInn);
  if(remaining.length===0){
    // all out fallback
    refreshedInn.isComplete = true;
    StorageManager.save();
    handleInningsProgress(m);
    render();
    return;
  }
  const aiSuggestedId = DB.settings.aiAssistantEnabled ? suggestNextBatter(m, refreshedInn) : null;
  playerPickerSheet('Select New Batter', remaining, (newId)=>{
    if(wasStriker){ refreshedInn.strikerId = newId; } else { refreshedInn.nonStrikerId = newId; }
    ensureBatter(refreshedInn,newId);
    StorageManager.save();
    render();
    const hero=$('#scoreHero'); if(hero){ void hero.offsetWidth; hero.classList.add('flash-wicket'); }
    vibrate([30,40,30]);
    handleInningsProgress(m);
  }, pid => pid===aiSuggestedId ? '🤖 AI suggestion — next in order' : '');
}

function handleInningsProgress(m){
  const inn = currentInnings(m);
  // over just ended and needs new bowler
  if(!inn.isComplete && !inn.bowlerId && inn.strikerId && inn.nonStrikerId){
    const bowlSquad = availableBowlers(m, inn);
    setTimeout(()=>{
      playerPickerSheet('Select Next Bowler', bowlSquad, (bowlerId)=>{
        inn.bowlerId = bowlerId; ensureBowler(inn,bowlerId);
        StorageManager.save(); render();
      });
    },300);
    return;
  }
  if(inn.isComplete){
    if(m.currentInnings===0){
      setTimeout(()=>startSecondInnings(m),400);
    } else {
      setTimeout(()=>finishMatch(m),400);
    }
  }
}
function startSecondInnings(m){
  const inn1 = m.innings[0];
  const target = inn1.runs+1;
  const battingTeam = inn1.bowlingTeam, bowlingTeam = inn1.battingTeam;
  const inn2 = newInnings(battingTeam, bowlingTeam, target);
  m.innings.push(inn2);
  m.currentInnings = 1;
  StorageManager.save();
  notify('inningsBreak', 'Innings Break', `${teamOf(m,inn1.battingTeam).name} scored ${inn1.runs}/${inn1.wickets}. ${teamOf(m,battingTeam).name} need ${target} to win.`, {matchId:m.id});
  logTimeline(m, 'inningsEnd', teamOf(m,inn1.battingTeam).name+' innings ends at '+inn1.runs+'/'+inn1.wickets+' — target '+target);
  showConfirm('Innings Break', `${teamOf(m,inn1.battingTeam).name} scored ${inn1.runs}/${inn1.wickets}. ${teamOf(m,battingTeam).name} need ${target} runs to win. Select openers to begin the chase.`, 'Select Openers', ()=>{
    openSelectOpenersFlow(m);
  }, false);
}
function computePlayerOfMatch(m){
  const batAgg={}, bowlAgg={};
  m.innings.forEach(inn=>{
    Object.keys(inn.batters).forEach(pid=>{ const b=inn.batters[pid]; batAgg[pid]=(batAgg[pid]||0)+b.runs; });
    Object.keys(inn.bowlers).forEach(pid=>{ const bw=inn.bowlers[pid]; bowlAgg[pid]=(bowlAgg[pid]||0)+bw.wickets; });
  });
  let bestId=null, bestScore=-1;
  const allPids = new Set([...Object.keys(batAgg),...Object.keys(bowlAgg)]);
  allPids.forEach(pid=>{
    const score = (batAgg[pid]||0) + (bowlAgg[pid]||0)*20;
    if(score>bestScore){ bestScore=score; bestId=pid; }
  });
  return bestId;
}
function finishMatch(m){
  const inn1 = m.innings[0], inn2 = m.innings[1];
  let text, winner=null;
  if(inn2.runs>inn1.runs){
    winner = inn2.battingTeam;
    const wktsLeft = squadOf(m,inn2.battingTeam).length-1-inn2.wickets;
    text = `${teamOf(m,winner).name} won by ${wktsLeft} wicket${wktsLeft!==1?'s':''}`;
  } else if(inn1.runs>inn2.runs){
    winner = inn1.battingTeam;
    const runMargin = inn1.runs-inn2.runs;
    text = `${teamOf(m,winner).name} won by ${runMargin} run${runMargin!==1?'s':''}`;
  } else {
    text = 'Match tied';
  }
  m.status='completed';
  m.result={text,winner};
  m.awards = { playerOfMatch: computePlayerOfMatch(m) };
  StorageManager.save();
  render();
  toast(text);
  notify('matchResult', 'Match Result', teamOf(m,'A').name+' vs '+teamOf(m,'B').name+' — '+text, {matchId:m.id});
  logTimeline(m, 'result', text);
  if(m.tournamentId){
    const tn = getTournament(m.tournamentId);
    if(tn){
      notify('tournament', tn.name+' — Points Table Updated', text, {tournamentId:tn.id});
      if(winner!=null && tn.fixtureSlots && tn.fixtureSlots.length){
        const slot = tn.fixtureSlots.find(s=>s.matchId===m.id);
        if(slot){
          const winnerTeamId = teamOf(m,winner).id;
          advanceWinnerInBracket(tn.fixtureSlots, slot, winnerTeamId);
          StorageManager.save();
        }
      }
    }
  }
}
function abandonMatch(m){
  m.status='abandoned';
  m.result={text:'Match abandoned', winner:null};
  StorageManager.save();
  render();
}

/* ==========================================================================
   TSC AI ASSISTANT (additive)
   Entirely offline, rule-based — plain JavaScript conditionals over data
   already in DB.matches. No network calls, no external model, no data ever
   leaves the device. Gated by DB.settings.aiAssistantEnabled.
   ========================================================================== */
function maxOversPerBowler(totalOvers){
  return Math.max(1, Math.ceil(totalOvers/5));
}
function computeAIInsights(m){
  const insights = [];
  if(m.status!=='live'){ return insights; }
  const inn = currentInnings(m);
  const cap = maxOversPerBowler(m.overs);
  // Bowling-figure sanity checks
  Object.keys(inn.bowlers).forEach(pid=>{
    const b = inn.bowlers[pid];
    const oversBowled = b.balls/m.ballsPerOver;
    if(oversBowled > cap){
      insights.push({type:'warn', text: playerName(pid)+' has bowled '+fmtOvers(b.balls,m.ballsPerOver)+' overs — over the '+cap+'-over-per-bowler limit for a '+m.overs+'-over match.'});
    }
    if(b.wickets > (squadOf(m, inn.battingTeam).length-1)){
      insights.push({type:'warn', text: playerName(pid)+"'s wicket count looks inconsistent with the number of batters available."});
    }
  });
  // Over completion confirmation
  if(inn.balls>0 && inn.balls % m.ballsPerOver === 0 && inn.bowlerId===null && !inn.isComplete){
    insights.push({type:'info', text: 'Over complete — pick the next bowler to continue (auto-detected).'});
  }
  // Required run rate reminder
  if(inn.target!=null){
    const maxBalls = m.overs*m.ballsPerOver;
    const need = Math.max(0, inn.target-inn.runs);
    const ballsLeft = Math.max(0, maxBalls-inn.balls);
    if(ballsLeft>0){
      insights.push({type:'info', text: teamOf(m,inn.battingTeam).name+' need '+need+' run'+(need!==1?'s':'')+' from '+ballsLeft+' ball'+(ballsLeft!==1?'s':'')+' ('+requiredRunRate(inn.target,inn.runs,inn.balls,maxBalls)+' RRR).'});
    }
  }
  if(!insights.length){
    insights.push({type:'ok', text:'No issues detected — scoring looks consistent.'});
  }
  return insights;
}
function suggestNextBatter(m, inn){
  const battingOrder = squadOf(m, inn.battingTeam);
  const notYetIn = battingOrder.find(pid=>{
    const b = inn.batters[pid];
    return (!b || (!b.out && b.balls===0)) && pid!==inn.strikerId && pid!==inn.nonStrikerId;
  });
  return notYetIn || null;
}
function openAIAssistantSheet(m){
  const insights = computeAIInsights(m);
  openSheet(`
    <h2>🤖 TSC AI Assistant</h2>
    <p style="font-size:12px;color:var(--clr-text-dim);margin:-8px 0 14px">Offline, rule-based — runs entirely on this device.</p>
    <div class="option-list">
      ${insights.map(i=>`<div class="option-item" style="cursor:default"><span class="oi-icon" style="background:${i.type==='warn'?'var(--clr-danger)':i.type==='ok'?'var(--clr-primary)':'var(--clr-info)'}">${i.type==='warn'?'!':i.type==='ok'?'✓':'i'}</span>${esc(i.text)}</div>`).join('')}
    </div>
    ${m.status==='completed'?`<button class="btn btn-primary btn-block" style="margin-top:16px" id="aiReportBtn">Generate Full Match Report</button>`:''}
  `);
  const btn = $('#aiReportBtn');
  if(btn) btn.onclick = ()=>{ closeOverlay(); openMatchReportSheet(m); };
}
function generateMatchReportText(m){
  const lines = [];
  lines.push('TSC ScorePro — Match Report');
  lines.push(teamOf(m,'A').name+' vs '+teamOf(m,'B').name);
  lines.push(fmtDate(m.date)+(m.venue?' · '+m.venue:''));
  lines.push('');
  lines.push(m.result?m.result.text:'Result pending');
  lines.push('');
  m.innings.forEach((inn,i)=>{
    lines.push((i+1)+'. '+teamOf(m,inn.battingTeam).name+': '+inn.runs+'/'+inn.wickets+' ('+fmtOvers(inn.balls,m.ballsPerOver)+' ov)');
  });
  lines.push('');
  // Top performers across the match
  let topBat=null, topBowl=null;
  m.innings.forEach(inn=>{
    Object.keys(inn.batters).forEach(pid=>{
      const b=inn.batters[pid];
      if(!topBat || b.runs>topBat.runs) topBat={pid,runs:b.runs,balls:b.balls};
    });
    Object.keys(inn.bowlers).forEach(pid=>{
      const bw=inn.bowlers[pid];
      if(!topBowl || bw.wickets>topBowl.wickets) topBowl={pid,wickets:bw.wickets,runs:bw.runs};
    });
  });
  if(topBat) lines.push('Top scorer: '+playerName(topBat.pid)+' — '+topBat.runs+' ('+topBat.balls+' balls)');
  if(topBowl) lines.push('Top bowler: '+playerName(topBowl.pid)+' — '+topBowl.wickets+' wkts for '+topBowl.runs);
  if(m.awards && m.awards.playerOfMatch) lines.push('Player of the Match: '+playerName(m.awards.playerOfMatch));
  lines.push('');
  const extrasTotal = m.innings.reduce((sum,inn)=>sum+inn.extras.wide+inn.extras.noball+inn.extras.bye+inn.extras.legbye+(inn.extras.penalty||0),0);
  lines.push('Total extras across the match: '+extrasTotal);
  lines.push('');
  lines.push('Generated offline by TSC ScorePro\'s rule-based assistant.');
  return lines.join('\n');
}
function openMatchReportSheet(m){
  const report = generateMatchReportText(m);
  openSheet(`
    <h2>Match Report</h2>
    <textarea class="input" readonly rows="14" style="font-family:monospace;font-size:12px;white-space:pre-wrap">${esc(report)}</textarea>
    <div style="display:flex;gap:10px;margin-top:12px">
      <button class="btn btn-outline btn-block" id="copyReportBtn">Copy Text</button>
      <button class="btn btn-primary btn-block" id="shareReportBtn">Share</button>
    </div>
  `);
  $('#copyReportBtn').onclick = async ()=>{
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){ await navigator.clipboard.writeText(report); toast('Report copied'); }
      else{ const ta=$('.sheet textarea'); if(ta){ ta.select(); document.execCommand('copy'); toast('Report copied'); } }
    }catch(e){ toast('Could not copy — select the text manually'); }

  $('#shareReportBtn').onclick = async ()=>{

function openRunningTimerSheet(label, totalSeconds){
  if(activeMatchTimer){ clearInterval(activeMatchTimer.intervalId); activeMatchTimer=null; }
  const state = { remaining: totalSeconds, paused:false };
  const render2 = ()=>{
    const mm = Math.floor(state.remaining/60), ss = state.remaining%60;
    const disp = $('#timerDisplay');
    if(disp) disp.textContent = (mm<10?'0':'')+mm+':'+(ss<10?'0':'')+ss;
    const btn = $('#timerPauseBtn');
    if(btn) btn.textContent = state.paused ? 'Resume' : 'Pause';
  };
  openSheet(`
    <h2 style="text-align:center">${esc(label)}</h2>
    <div id="timerDisplay" style="font-family:var(--font-display);font-size:64px;font-weight:700;text-align:center;color:var(--clr-primary);margin:10px 0 20px">00:00</div>

      <button class="btn btn-outline btn-block" id="timerPauseBtn">Pause</button>
      <button class="btn btn-danger btn-block" id="timerStopBtn">Stop</button>
    </div>
  `, {persistent:true});
  render2();
  const intervalId = setInterval(()=>{
    if(state.paused) return;
    state.remaining--;
    if(state.remaining<=0){
      clearInterval(intervalId);
      activeMatchTimer=null;
      toast(label+' finished');
      vibrate([30,50,30,50,30]);
      closeOverlay();
      return;
    }
    render2();
  }, 1000);
  activeMatchTimer = { intervalId };
  $('#timerPauseBtn').onclick = ()=>{ state.paused=!state.paused; render2(); };
  $('#timerStopBtn').onclick = ()=>{ clearInterval(intervalId); activeMatchTimer=null; closeOverlay(); };
}

/* ==========================================================================
   RAIN / DLS CALCULATOR (additive)
   IMPORTANT: this is a simplified, clearly-labelled rain-affected target
   resetter — NOT the official ICC Duckworth-Lewis-Stern method, which relies
   on licensed resource tables this offline app cannot legally embed. It
   scales the target by the ratio of overs available, a widely used
   approximation for casual/local cricket.
   ========================================================================== */
function openDLSCalculatorSheet(m){
  const inn = currentInnings(m);
  openSheet(`
    <h2>Rain / DLS Calculator</h2>
    <p style="font-size:12px;color:var(--clr-text-dim);margin:-8px 0 14px;line-height:1.5">Simplified rain-rule target resetter (overs-ratio based) — not the official ICC DLS method, which needs licensed resource tables. Use for informal/local matches.</p>
    <div class="field"><label>New total overs for this innings</label><input class="input" id="dlsNewOvers" type="number" min="1" max="${m.overs}" placeholder="e.g. 15"></div>
    <button class="btn btn-primary btn-block" id="dlsApplyBtn">Apply Revised Target</button>
  `);
  $('#dlsApplyBtn').onclick = ()=>{
    const newOvers = parseInt($('#dlsNewOvers').value,10);
    if(!newOvers || newOvers<1 || newOvers>=m.overs){ toast('Enter a valid reduced overs number'); return; }
    const oldOvers = m.overs;
    m.overs = newOvers;
    let logText;
    if(m.currentInnings===0){
      logText = 'Overs reduced from '+oldOvers+' to '+newOvers+' (1st innings, rain-affected)';
    } else {
      const firstInnRuns = m.innings[0].runs;
      const revisedTarget = Math.floor(firstInnRuns * (newOvers/oldOvers)) + 1;
      inn.target = revisedTarget;
      logText = 'Overs reduced to '+newOvers+'. Revised target: '+revisedTarget;
    }
    logTimeline(m, 'dls', logText);
    StorageManager.save();
    closeOverlay();
    render();
    toast('DLS target updated');
  };
}

function readImageAsDataURL(file, cb){
  const reader = new FileReader();
  reader.onload = (e)=>{
    const img = new Image();
    img.onload = ()=>{
      const maxSize = 200;
      let w = img.width, h = img.height;
      if(w>h){ if(w>maxSize){ h=Math.round(h*maxSize/w); w=maxSize; } }
      else { if(h>maxSize){ w=Math.round(w*maxSize/h); h=maxSize; } }
      const canvas = document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img,0,0,w,h);
      try{ cb(canvas.toDataURL('image/jpeg',0.82)); }
      catch(err){ cb(e.target.result); }
    };
    img.onerror = ()=>{ toast('Could not read image'); };
    img.src = e.target.result;
  };
  reader.onerror = ()=>{ toast('Could not read file'); };
  reader.readAsDataURL(file);
}
/* ==========================================================================
   PLAYER ID CARD MODULE (additive)
   - The card is a presentation layer over the EXISTING player record.
   - Player ID shown = the player's existing permanent key (p.id). It is never
     generated, re-generated or changed here.
   - New optional fields (backward compatible, absent on older players):
     role, joinDate, membershipStatus, contact, address, showContactOnCard
     → missing values display as "Not Provided".
   ========================================================================== */
const IDC_CLUB = 'SALAVORA TALTOLA SPORTING CLUB';
const IDC_BRAND = 'TSC CRICKET SCORE';
const PLAYER_ROLES = ['Batter','Bowler','All-rounder','Wicketkeeper'];
const MEMBERSHIP_STATUSES = [
  {id:'active', label:'Active', color:'#2ECC71'},
  {id:'inactive', label:'Inactive', color:'#F0B429'},
  {id:'retired', label:'Retired', color:'#94A3B8'},
];
const IDC_NA = 'Not Provided';
function idcVal(v){ return (v===undefined||v===null||String(v).trim()==='') ? IDC_NA : String(v); }
function idcStatus(p){ return MEMBERSHIP_STATUSES.find(s=>s.id===p.membershipStatus) || null; }
function idcJoined(p){ return p.joinDate ? fmtDate(p.joinDate) : IDC_NA; }
/* QR payload: plain text built from the existing permanent ID (no invented URL).
   The app's QR encoder is byte-mode/ASCII, so text is sent as UTF-8 bytes and
   trimmed to the encoder's capacity (78 bytes). */
function idcQRText(p){
  const utf8 = s => unescape(encodeURIComponent(s));
  let base = 'TSC CRICKET SCORE\nPLAYER ID: '+p.id+'\n';
  let name = p.name||'';
  while(name && utf8(base+name).length>78) name = name.slice(0,-1);
  const out = utf8(base+name);
  return out.length<=78 ? out : utf8(base).slice(0,78);
}
function idcQRSVG(p){
  try{ const r = generateQRMatrix(idcQRText(p)); return r ? qrMatrixToSVG(r.matrix, r.size, 4) : ''; }catch(e){ return ''; }
}

function idcLoadImage(src){
  return new Promise(res=>{ if(!src) return res(null); const im=new Image(); im.onload=()=>res(im); im.onerror=()=>res(null); im.src=src; });
}
function idcFitText(ctx, text, maxW, size, weight, family){
  let s=size; do{ ctx.font=`${weight} ${s}px ${family}`; if(ctx.measureText(text).width<=maxW) break; s-=1; }while(s>10);
  if(ctx.measureText(text).width>maxW){ while(text.length>1 && ctx.measureText(text+'…').width>maxW) text=text.slice(0,-1); text+='…'; }
  return text;
}

function idcShare(p){
  const text = `${IDC_BRAND}\n${IDC_CLUB}\nPlayer: ${p.name||IDC_NA}\nPlayer ID: ${p.id}\nJersey: ${idcVal(p.jersey)}\nRole: ${idcVal(p.role)}`;

  showConfirm('Share Player ID', `This will share the player's name, Player ID, jersey number and role.${card} Contact number and address are never included in the shared text. Continue?`, 'Share', async ()=>{
    try{
      if(navigator.share){
        try{
          if(navigator.canShare){
            const blob = await (await fetch(await idcCardPNG(p))).blob();
            const file = new File([blob], idcFileName(p), {type:'image/png'});
            if(navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:'Player ID — '+(p.name||''), text}); return; }
          }
        }catch(e){ if(e && e.name==='AbortError') return; }
        await navigator.share({title:'Player ID — '+(p.name||''), text}); return;
      }
    }catch(e){ if(e && e.name==='AbortError') return; }
    try{ await navigator.clipboard.writeText(text); toast('Player ID details copied — paste to share'); }
    catch(e){ openSheet(`<h2>Share Player ID</h2><textarea class="input" rows="7" readonly style="width:100%">${esc(text)}</textarea><p style="font-size:12px;color:var(--clr-text-dim)">Select and copy the text to share.</p><button class="btn btn-ghost btn-block" data-action="dismiss-sheet">Close</button>`); }
  }, false);
}

/* ==========================================================================
   MATCH CARDS + SCHEDULE & COUNTDOWN MODULE (additive)
   Data: DB.schedule = [ {
     id, kind:'tournament'|'series'|'friendly', tournamentId|null, slotId|null,
     teamAId (home), teamBId (opponent), date:'YYYY-MM-DD', time:'HH:MM',
     venue, overs, notes, status:'scheduled'|'postponed'|'cancelled',
     matchId|null (set when the match is started), reschedules:[{from,to,at}], createdAt } ]
   Older backups simply have no `schedule` key → treated as an empty list.
   Times are the device's local time.
   ========================================================================== */
if(!Array.isArray(DB.schedule)) DB.schedule = [];
const SCH_SOON_MIN = 60;               // "Starting Soon" window before start time
const SCH_KINDS = [{id:'tournament',label:'Tournament'},{id:'series',label:'Series'},{id:'friendly',label:'Friendly'}];
const SCH_STATUS = {
  upcoming:{label:'Upcoming', color:'var(--st-up,#C4B5FD)', bg:'var(--st-up-bg,rgba(196,181,253,.15))'},
  soon:{label:'Starting Soon', color:'#FBBF24', bg:'rgba(251,191,36,.15)'},
  live:{label:'Live', color:'var(--st-live,#34D399)', bg:'var(--st-live-bg,rgba(52,211,153,.18))'},
  completed:{label:'Completed', color:'#34D399', bg:'rgba(52,211,153,.15)'},
  postponed:{label:'Postponed', color:'#FB923C', bg:'rgba(249,115,22,.16)'},
  cancelled:{label:'Cancelled', color:'#94A3B8', bg:'rgba(148,163,184,.16)'},
};
function schLoc(){ try{ return DB.settings.language==='bn' ? 'bn-BD-u-nu-latn' : undefined; }catch(e){ return undefined; } }
function schGet(id){ return DB.schedule.find(s=>s.id===id); }
function schTeam(id){ return DB.teams.find(t=>t.id===id) || null; }
function schTeamName(id){ const t=schTeam(id); return t ? t.name : 'Unknown Team'; }
function schTs(s){
  if(!s || !/^\d{4}-\d{2}-\d{2}$/.test(s.date||'') || !/^\d{2}:\d{2}$/.test(s.time||'')) return null;
  const d = new Date(s.date+'T'+s.time+':00');   // parsed as device-local time
  return isNaN(d.getTime()) ? null : d.getTime();
}
function schKindOf(s){
  const t = s.tournamentId ? getTournament(s.tournamentId) : null;
  return t ? (t.type||'tournament') : (s.kind||'friendly');
}
function schKindLabel(s){
  const t = s.tournamentId ? getTournament(s.tournamentId) : null;
  const k = (SCH_KINDS.find(x=>x.id===schKindOf(s))||SCH_KINDS[2]).label;
  return t ? k+' · '+t.name : k;
}
function schStatus(s, now){
  now = now || Date.now();
  const m = s.matchId ? getMatch(s.matchId) : null;
  if(m) return m.status==='live' ? 'live' : 'completed';
  if(s.status==='cancelled') return 'cancelled';
  if(s.status==='postponed') return 'postponed';
  const ts = schTs(s);
  if(ts===null) return 'upcoming';
  return (now >= ts - SCH_SOON_MIN*60000) ? 'soon' : 'upcoming';
}
function schCanStart(s){
  if(s.matchId || s.status==='cancelled' || s.status==='postponed') return false;
  if(!schTeam(s.teamAId) || !schTeam(s.teamBId)) return false;
  const ts = schTs(s); if(ts===null) return false;
  const today = new Date(); today.setHours(0,0,0,0);
  return schStatus(s)==='soon' || ts < today.getTime()+86400000;   // today, past-due, or within the soon window
}
function schDayDiff(ts){
  const a=new Date(); a.setHours(0,0,0,0); const b=new Date(ts); b.setHours(0,0,0,0);
  return Math.round((b-a)/86400000);
}
function schFriendlyLabel(s){
  const st = schStatus(s);
  if(st==='live') return {cls:'soon', text:'Live now'};
  if(st==='soon'){ const ts=schTs(s); return {cls:'soon', text: ts<=Date.now() ? 'Start time reached' : 'Starting Soon'}; }
  const ts = schTs(s); if(ts===null) return {cls:'later', text:'Date TBD'};
  const dd = schDayDiff(ts);
  if(dd===0) return {cls:'today', text:'Today'};
  if(dd===1) return {cls:'tomorrow', text:'Tomorrow'};
  return {cls:'later', text:'Starts in '+dd+' days'};
}
function schFmtTime(s){
  const ts=schTs(s); if(ts===null) return '—';
  return new Date(ts).toLocaleTimeString(schLoc(), {hour:'numeric', minute:'2-digit'});
}
function schFmtDate(s){
  const ts=schTs(s); if(ts===null) return 'Date TBD';
  return new Date(ts).toLocaleDateString(schLoc(), {weekday:'short', day:'2-digit', month:'short', year:'numeric'});
}
function schParts(ms){
  ms = Math.max(0, ms); const t=Math.floor(ms/1000);
  return {d:Math.floor(t/86400), h:Math.floor(t%86400/3600), m:Math.floor(t%3600/60), s:t%60};
}
const schP2 = n => String(n).padStart(2,'0');
function schInlineCD(ms){ const p=schParts(ms); return (p.d? p.d+'d ' : '')+schP2(p.h)+'h '+schP2(p.m)+'m '+schP2(p.s)+'s'; }


/* ---------- Upcoming-match countdown (big "15h : 32m : 33s" + start time line) ---------- */
function ucdText(ms){
  if(ms<=0) return 'Starting now';
  const p = schParts(ms);
  return (p.d ? p.d+'d : ' : '') + schP2(p.h)+'h : '+schP2(p.m)+'m : '+schP2(p.s)+'s';
}
function ucdStartLine(ts){
  const d = new Date(ts);
  let tz = '';
  try{ tz = new Intl.DateTimeFormat('en-US',{timeZoneName:'short'}).formatToParts(d).find(x=>x.type==='timeZoneName').value; }catch(e){}
  const date = d.toLocaleDateString(schLoc(), {month:'short', day:'numeric'});
  const time = d.toLocaleTimeString(schLoc(), {hour:'2-digit', minute:'2-digit', hour12:false});
  return 'Match starts at '+date+', '+time+(tz?' '+tz:'');
}
function ucdHTML(ts){
  return `<div class="ucd"><div class="ucd-time" data-cd="${ts}" data-cd-mode="big">${ucdText(ts-Date.now())}</div><div class="ucd-at" data-no-tr-date>${esc(ucdStartLine(ts))}</div></div>`;
}

function mc2Logo(team, fallbackName, color){
  const jc = (team&&team.color) || color || '#2563EB';
  const inner = team&&team.logo ? `<img src="${team.logo}" alt="">` : esc(initials(fallbackName||'?'));
  return `<div class="mc2-logo" style="--jc:${esc(jc)}">${inner}</div>`;
}
function mc2Pill(st){ const c=SCH_STATUS[st]; return `<span class="st-pill ${st==='live'?'st-live':''}" style="color:${c.color};background:${c.bg}"><i></i>${c.label}</span>`; }
function mc2TeamBlock(team, name, color, sub){
  return `<div class="mc2-team">${mc2Logo(team,name,color)}<div class="mc2-tname">${esc(name)}</div><div class="mc2-jersey" style="--jc:${esc((team&&team.color)||color||'#2563EB')}"></div><div class="mc2-tsub">${sub}</div></div>`;
}
function mc2ScheduleCardHTML(s){
  const st = schStatus(s), m = s.matchId ? getMatch(s.matchId) : null;
  const A = schTeam(s.teamAId), B = schTeam(s.teamBId);
  const ts = schTs(s);
  let scoreLine = '';
  if(m && m.innings && m.innings.length){
    const inn = m.innings[m.innings.length-1];
    scoreLine = m.status==='completed' && m.result ? esc(m.result.text) : `${esc(teamOf(m,inn.battingTeam).name)} ${inn.runs}/${inn.wickets} (${fmtOvers(inn.balls,m.ballsPerOver)} ov)`;
  }
  const showCD = (st==='upcoming'||st==='soon') && ts!==null && ts>Date.now() && ts-Date.now() < 7*86400000;
  return `<div class="mc2">
    <div class="mc2-top"><span class="mc2-type">${esc(schKindLabel(s))}</span>${mc2Pill(st)}</div>
    <div class="mc2-teams">
      ${mc2TeamBlock(A, A?A.name:'Unknown Team', null, 'HOME')}
      <div class="mc2-vs">VS</div>
      ${mc2TeamBlock(B, B?B.name:'Unknown Team', null, 'AWAY')}
    </div>
    ${scoreLine?`<div class="mc2-score">${scoreLine}</div>`:''}
    <div class="mc2-meta">
      <div>📅 <b>${esc(schFmtDate(s))}</b></div>
      <div>⏰ <b>${esc(schFmtTime(s))}</b></div>
      <div>🏟️ <b>${esc(s.venue||'Venue TBD')}</b></div>
      <div>🏏 <b>${s.overs?esc(s.overs)+' overs':'Overs TBD'}</b></div>
    </div>
    ${(st==='upcoming'||st==='soon') && ts!==null ? ucdHTML(ts) : (showCD?`<div class="mc2-cd">⏱ <span data-cd-label="${s.id}">${esc(schFriendlyLabel(s).text)}</span> <b data-cd="${ts}" data-cd-mode="inline">${schInlineCD(ts-Date.now())}</b></div>`:'')}
    ${s.reschedules&&s.reschedules.length&&st!=='cancelled'?`<div class="mc2-note">↻ Rescheduled${s.reschedules.length>1?' ×'+s.reschedules.length:''}</div>`:''}
    <div class="mc2-actions">
      <button class="mc2-btn ${schCanStart(s)?'ghost':'primary'}" data-action="sch-view" data-id="${s.id}">View Match</button>
      ${schCanStart(s)?`<button class="mc2-btn start" data-action="sch-start" data-id="${s.id}">▶ Start Match</button>`:''}
    </div>
  </div>`;
}
function mc2MatchCardHTML(m){
  const a=teamOf(m,'A'), b=teamOf(m,'B');
  const A=DB.teams.find(x=>x.id===a.id), B=DB.teams.find(x=>x.id===b.id);
  const st = m.status==='live' ? 'live' : (m.status==='abandoned' ? 'cancelled' : 'completed');
  const t = m.tournamentId ? getTournament(m.tournamentId) : null;
  const kind = t ? tournamentTypeLabel(t.type)+' · '+t.name : 'Friendly';
  let scoreLine='';
  if(m.status==='completed' && m.result) scoreLine = esc(m.result.text);
  else if(m.innings && m.innings.length){ const inn=m.innings[m.innings.length-1]; scoreLine = `${esc(teamOf(m,inn.battingTeam).name)} ${inn.runs}/${inn.wickets} (${fmtOvers(inn.balls,m.ballsPerOver)} ov)`; if(m.status==='live') scoreLine += `<div class="mc2-need">${esc(cbxNeedText(m,inn).text)} · CRR ${runRate(inn.runs,inn.balls)}${inn.target!=null?' · REQ '+requiredRunRate(inn.target,inn.runs,inn.balls,m.overs*m.ballsPerOver):''}</div>`; }
  return `<div class="mc2">
    <div class="mc2-top"><span class="mc2-type">${esc(kind)}</span>${mc2Pill(st)}</div>
    <div class="mc2-teams">
      ${mc2TeamBlock(A, a.name, a.color, 'HOME')}
      <div class="mc2-vs">VS</div>
      ${mc2TeamBlock(B, b.name, b.color, 'AWAY')}
    </div>
    ${scoreLine?`<div class="mc2-score">${scoreLine}</div>`:''}
    <div class="mc2-meta">
      <div>📅 <b>${esc(fmtDate(m.date))}</b></div>
      <div>🏏 <b>${m.overs?esc(m.overs)+' overs':'—'}</b></div>
      <div style="grid-column:1/-1">🏟️ <b>${esc(m.venue||'Venue TBD')}</b></div>
    </div>
    <div class="mc2-actions"><button class="mc2-btn primary" data-action="open-match" data-id="${m.id}">View Match</button></div>
  </div>`;
}
function mc2Entries(){
  const now = Date.now(), linked = new Set(DB.schedule.map(s=>s.matchId).filter(Boolean));
  const rank = {live:0, soon:1, upcoming:2, postponed:3, completed:4, cancelled:5};
  const list = DB.schedule.map(s=>({kind:'s', s, st:schStatus(s,now), ts:schTs(s)}));
  DB.matches.filter(m=>!linked.has(m.id)).forEach(m=>{
    list.push({kind:'m', m, st: m.status==='live'?'live':(m.status==='abandoned'?'cancelled':'completed'), ts:new Date(m.date).getTime()||0});
  });
  list.sort((x,y)=>{
    if(rank[x.st]!==rank[y.st]) return rank[x.st]-rank[y.st];
    const tx = x.ts==null?Infinity:x.ts, ty = y.ts==null?Infinity:y.ts;
    return (x.st==='completed'||x.st==='cancelled') ? ty-tx : tx-ty;
  });
  return list;
}
function mc2ScreenHTML(){
  const f = AppState.mcFilter || 'all';
  const filters = [['all','All'],['upcoming','Upcoming'],['live','Live'],['completed','Completed'],['postponed','Postponed'],['cancelled','Cancelled']];
  let list = mc2Entries();
  if(f==='upcoming') list = list.filter(e=>e.st==='upcoming'||e.st==='soon');
  else if(f!=='all') list = list.filter(e=>e.st===f);
  return `
  <div class="mh-bar"><div class="section-title" style="margin:0">Match Center</div><button class="mc2-addbtn" data-action="sch-new">+ Schedule Match</button></div>
  <div class="mh-filters">${filters.map(([id,l])=>`<span data-mc-filter="${id}" style="${f===id?'background:var(--mc-accent,#2563EB);color:#fff':'background:var(--clr-surface-alt);color:var(--clr-text-dim)'}">${l}</span>`).join('')}</div>
  ${list.length ? list.map(e=>e.kind==='s'?mc2ScheduleCardHTML(e.s):mc2MatchCardHTML(e.m)).join('')
    : `<div class="card empty-state" style="padding:28px">${icon('empty')}<p>No matches here yet.</p><button class="btn btn-primary" data-action="sch-new">+ Schedule Match</button></div>`}
  `;
}

/* ---------- Feature 2: schedule & countdown ---------- */
function schFiltered(){
  const f = AppState.schFilter || 'all';
  const now = Date.now();
  let list = DB.schedule.filter(s=>{ const st=schStatus(s,now); return st==='upcoming'||st==='soon'||st==='postponed'; });  // cancelled/started never in the active list
  const sod = new Date(); sod.setHours(0,0,0,0); const day=86400000;
  const inRange = (s,a,b)=>{ const ts=schTs(s); return ts!==null && ts>=a && ts<b; };
  if(f==='today') list = list.filter(s=>s.status!=='postponed' && inRange(s, sod.getTime(), sod.getTime()+day));
  else if(f==='tomorrow') list = list.filter(s=>s.status!=='postponed' && inRange(s, sod.getTime()+day, sod.getTime()+2*day));
  else if(f==='week') list = list.filter(s=>s.status!=='postponed' && inRange(s, sod.getTime(), sod.getTime()+7*day));
  else if(f==='tournament'||f==='series'||f==='friendly') list = list.filter(s=>schKindOf(s)===f);
  return list.sort((a,b)=>{
    const pa = a.status==='postponed', pb = b.status==='postponed'; if(pa!==pb) return pa?1:-1;
    const ta=schTs(a), tb=schTs(b); return (ta==null?Infinity:ta)-(tb==null?Infinity:tb);
  });
}
function schItemHTML(s){
  const st = schStatus(s), ts = schTs(s), lab = schFriendlyLabel(s);
  const cd = (ts!==null && st!=='postponed') ? (ts>Date.now()
      ? `<b data-cd="${ts}" data-cd-mode="inline">${schInlineCD(ts-Date.now())}</b>`
      : `<b>${esc(lab.text)}</b>`) : `<b>${st==='postponed'?'Postponed':'Date TBD'}</b>`;
  return `<div class="sch-item" data-action="sch-view" data-id="${s.id}">
    <div class="r1"><span class="sch-time">⏰ ${esc(schFmtTime(s))}</span><span class="sch-tag">${esc((SCH_KINDS.find(k=>k.id===schKindOf(s))||SCH_KINDS[2]).label)}</span></div>
    <div class="sch-teams">${esc(schTeamName(s.teamAId))} <span style="color:#D946EF">vs</span> ${esc(schTeamName(s.teamBId))}</div>
    <div class="sch-sub">🏟️ ${s.venue?`<span data-no-tr>${esc(s.venue)}</span>`:'<span>Venue TBD</span>'} · <span>${s.overs?esc(s.overs)+' overs':'Overs TBD'}</span>${s.tournamentId&&getTournament(s.tournamentId)?' · <span data-no-tr>'+esc(getTournament(s.tournamentId).name)+'</span>':''}</div>
    <div class="sch-cdi">${cd}${schCanStart(s)?`<button class="sch-start" data-action="sch-start" data-id="${s.id}">▶ Start</button>`:''}</div>
  </div>`;
}
function schHeroHTML(s){
  const ts = schTs(s), lab = schFriendlyLabel(s), p = schParts((ts||0)-Date.now());
  return `<div class="sch-hero">
    <div class="sch-kicker">Next Match</div>
    <div class="sch-hero-t">${esc(schTeamName(s.teamAId))} vs ${esc(schTeamName(s.teamBId))}</div>
    <div class="sch-hero-s">${esc(schFmtDate(s))} · ${esc(schFmtTime(s))}${s.venue?' · '+esc(s.venue):''}</div>
    <div class="sch-tiles" data-cd="${ts}" data-cd-mode="tiles">
      <div class="sch-tile"><b data-u="d">${schP2(p.d)}</b><span>Days</span></div>
      <div class="sch-tile"><b data-u="h">${schP2(p.h)}</b><span>Hours</span></div>
      <div class="sch-tile"><b data-u="m">${schP2(p.m)}</b><span>Mins</span></div>
      <div class="sch-tile"><b data-u="s">${schP2(p.s)}</b><span>Secs</span></div>
    </div>
    <span class="sch-label ${lab.cls}" data-cd-label="${s.id}">${esc(lab.text)}</span>
    ${schCanStart(s)?`<div style="margin-top:12px"><button class="sch-start" style="padding:10px 18px;font-size:13px" data-action="sch-start" data-id="${s.id}">▶ Start Match</button></div>`:''}
  </div>`;
}
function schScreenHTML(){
  const f = AppState.schFilter || 'all';
  const filters = [['all','All Upcoming'],['today','Today'],['tomorrow','Tomorrow'],['week','This Week'],['tournament','Tournament'],['series','Series'],['friendly','Friendly']];
  const list = schFiltered();
  const timed = list.filter(s=>s.status!=='postponed' && schTs(s)!==null);
  const hero = timed.find(s=>schTs(s)>Date.now());
  const groups = []; const byKey = {};
  timed.forEach(s=>{ const k=s.date; if(!byKey[k]){ byKey[k]={date:k, items:[]}; groups.push(byKey[k]); } byKey[k].items.push(s); });
  const postponed = list.filter(s=>s.status==='postponed' || schTs(s)===null);
  const dayBlock = g=>{
    const d = new Date(g.date+'T00:00:00'), dd = schDayDiff(d.getTime());
    const name = dd===0?'Today':dd===1?'Tomorrow':dd<0?'Past due':d.toLocaleDateString(schLoc(), {weekday:'long'});
    return `<div class="sch-day">
      <div class="sch-date ${dd<=1&&dd>=0?'':'other'}"><div class="d">${d.getDate()}</div><div class="m">${d.toLocaleDateString(schLoc(), {month:'short'})}</div><div class="w">${d.toLocaleDateString(schLoc(), {weekday:'short'})}</div></div>
      <div class="sch-line"><div class="sch-dayname">${name}</div>${g.items.map(schItemHTML).join('')}</div>
    </div>`;
  };
  return `
  <div class="mh-bar"><div class="section-title" style="margin:0">Schedule</div><button class="sch-addbtn" data-action="sch-new">+ Schedule Match</button></div>
  <div class="sch">
    <div class="mh-filters">${filters.map(([id,l])=>`<span class="${f===id?'active':''}" data-sch-filter="${id}">${l}</span>`).join('')}</div>
    ${hero?schHeroHTML(hero):''}
    ${groups.map(dayBlock).join('')}
    ${postponed.length?`<div class="sch-day"><div class="sch-date other"><div class="d">⏸</div><div class="m">Hold</div></div><div class="sch-line"><div class="sch-dayname">Postponed — awaiting new date</div>${postponed.map(schItemHTML).join('')}</div></div>`:''}
    ${!list.length?`<div class="sch-empty">No scheduled matches for this filter.<br><br><button class="sch-addbtn" data-action="sch-new">+ Schedule Match</button></div>`:''}
  </div>`;
}

  <button class="btn btn-primary btn-block" style="margin-top:6px" data-action="sch-save" data-id="${s?s.id:''}">${s?'Save Changes':'Save Schedule'}</button>

function schTournamentOptions(kind, selected){
  const ts = DB.tournaments.filter(t=>(t.type||'tournament')===kind);
  const first = kind==='friendly' ? `<option value="">Standalone friendly (no cup)</option>` : `<option value="">— Select —</option>`;
  return first + ts.map(t=>`<option value="${t.id}" ${selected===t.id?'selected':''}>${esc(t.name)}${t.seasonLabel?' ('+esc(t.seasonLabel)+')':''}</option>`).join('');
}
function schSaveFromForm(id){
  const kind = $('#schKindRow .chip.active')?.dataset.schKind || 'friendly';
  const tournamentId = $('#schTournament')?.value || null;
  const teamAId = $('#schTeamA').value, teamBId = $('#schTeamB').value;
  const date = $('#schDate').value, time = $('#schTime').value;
  const venue = $('#schVenue').value.trim(), notes = $('#schNotes').value.trim();
  const oversRaw = $('#schOvers').value.trim(); const overs = oversRaw ? parseInt(oversRaw,10) : null;
  if(kind!=='friendly' && !tournamentId){ toast(kind==='series'?'Select a series (create one in Tournaments first)':'Select a tournament (create one in Tournaments first)'); return; }
  if(!teamAId || !teamBId){ toast('Select both teams'); return; }
  if(teamAId===teamBId){ toast('Teams must be different'); return; }
  if(schTs({date,time})===null){ toast('Enter a valid date and start time'); return; }
  if(oversRaw && (!overs || overs<1 || overs>200)){ toast('Enter a valid number of overs'); return; }
  let s = id ? schGet(id) : null;
  const when = date+' '+time;
  if(!s){
    const pre = (AppState.screenParams||{}).prefill || {};
    s = {id:uid('sch'), kind, tournamentId, slotId:pre.slotId||null, teamAId, teamBId, date, time, venue, overs, notes, status:'scheduled', matchId:null, reschedules:[], createdAt:new Date().toISOString()};
    DB.schedule.push(s);
    notify('tournament','Match Scheduled', schTeamName(teamAId)+' vs '+schTeamName(teamBId)+' — '+schFmtDate(s)+' '+schFmtTime(s));
    toast('Match scheduled');
  } else {
    const old = s.date+' '+s.time;
    if(old!==when){
      s.reschedules = s.reschedules||[]; s.reschedules.push({from:old, to:when, at:new Date().toISOString()});
      if(s.status==='postponed') s.status='scheduled';
      notify('tournament','Match Rescheduled', schTeamName(teamAId)+' vs '+schTeamName(teamBId)+' — now '+when);
    }
    Object.assign(s,{kind, tournamentId, teamAId, teamBId, date, time, venue, overs, notes});
    toast('Schedule updated');
  }
  StorageManager.save();
  goBack();
}

      ${st!=='cancelled'?`<button class="btn btn-outline" style="color:var(--clr-danger)" data-action="sch-cancel" data-id="${s.id}">Cancel Match</button>`:`<button class="btn btn-outline" data-action="sch-restore" data-id="${s.id}">Restore</button>`}
      <button class="btn btn-ghost" style="color:var(--clr-danger)" data-action="sch-delete" data-id="${s.id}">Delete</button>
    </div>
    <button class="btn btn-ghost btn-block" style="margin-top:8px" data-action="dismiss-sheet">Close</button>`);
}
function schStart(s){
  if(!schCanStart(s)){ toast('This match cannot be started yet'); return; }
  closeOverlay();
  AppState.newMatchDraft = null;
  const d = ensureDraft();
  d.teamAId = s.teamAId; d.teamBId = s.teamBId;
  d.tournamentId = s.tournamentId || '';
  if(s.overs){ d.overs = s.overs; d.customOvers = ![5,10,15,20,50].includes(Number(s.overs)); }
  else { const t = s.tournamentId && getTournament(s.tournamentId); if(t && t.overs) d.overs = t.overs; }
  d.venue = s.venue || ''; d.date = s.date || d.date;
  d.scheduleId = s.id;
  if(s.slotId && s.tournamentId) AppState.activeFixtureSlot = {tournamentId:s.tournamentId, slotId:s.slotId};
  pushScreen('newMatch');
}
/* Called right after a new match is pushed to DB.matches (see validateAndCreateMatch). */
function schLinkCreatedMatch(match, d){
  if(!d || !d.scheduleId) return;
  const s = schGet(d.scheduleId);
  if(s && !s.matchId){ s.matchId = match.id; if(s.status==='postponed') s.status='scheduled'; }
}
function schHandleAction(a, el){
  if(!a || a.indexOf('sch-')!==0) return false;
  const s = el.dataset.id ? schGet(el.dataset.id) : null;
  switch(a){
    case 'sch-new': pushScreen('scheduleEdit',{}); break;
    case 'sch-from-fixture': {
      const t = getTournament(el.dataset.tid), slot = t && (t.fixtureSlots||[]).find(x=>x.id===el.dataset.sid);
      if(!slot) break;
      const ex = DB.schedule.find(x=>x.slotId===slot.id && x.status!=='cancelled' && !x.matchId);
      if(ex){ pushScreen('scheduleEdit',{id:ex.id}); break; }
      pushScreen('scheduleEdit',{prefill:{kind:t.type||'tournament', tournamentId:t.id, slotId:slot.id, teamAId:slot.teamAId, teamBId:slot.teamBId, overs:t.overs||''}});
      break;
    }
    case 'sch-save': schSaveFromForm(el.dataset.id||null); break;
    case 'sch-view': if(s) schOpenDetail(s); break;
    case 'sch-start': if(s) schStart(s); break;
    case 'sch-edit': if(s){ closeOverlay(); pushScreen('scheduleEdit',{id:s.id}); } break;
    case 'sch-postpone': if(s){ s.status='postponed'; StorageManager.save(); closeOverlay(); render(); toast('Match postponed'); notify('tournament','Match Postponed', schTeamName(s.teamAId)+' vs '+schTeamName(s.teamBId)); } break;
    case 'sch-resume': if(s){ s.status='scheduled'; StorageManager.save(); closeOverlay(); render(); toast('Match back on schedule'); } break;
    case 'sch-cancel': if(s) showConfirm('Cancel Match','Cancel this scheduled match? It leaves the upcoming list but stays in Match Cards → Cancelled.','Cancel Match',()=>{
        s.status='cancelled'; s.cancelledAt=new Date().toISOString(); StorageManager.save(); render(); toast('Match cancelled');
        notify('tournament','Match Cancelled', schTeamName(s.teamAId)+' vs '+schTeamName(s.teamBId)); }); break;
    case 'sch-restore': if(s){ s.status='scheduled'; StorageManager.save(); closeOverlay(); render(); toast('Match restored'); } break;
    case 'sch-delete': if(s) showConfirm('Delete Schedule','Permanently delete this scheduled entry? Matches already played are not affected.','Delete',()=>{
        DB.schedule = DB.schedule.filter(x=>x.id!==s.id); StorageManager.save(); render(); toast('Schedule deleted'); }); break;
    default: return false;
  }
  return true;
}

/* Live ticker: updates every second; re-renders only when a status bucket changes */
let schLastSig = '';
function schSignature(){ const now=Date.now(); return DB.schedule.map(s=>s.id+':'+schStatus(s,now)+':'+(schTs(s)!==null?schDayDiff(schTs(s)):'x')).join('|'); }
setInterval(function(){
  const now = Date.now();
  document.querySelectorAll('[data-cd]').forEach(el=>{
    const ts = Number(el.dataset.cd); if(!ts) return;
    const left = ts - now;
    if(el.dataset.cdMode==='big'){
      const t = ucdText(left); if(el.textContent!==t) el.textContent = t;
    } else if(el.dataset.cdMode==='tiles'){
      const p = schParts(left);
      ['d','h','m','s'].forEach(u=>{ const b=el.querySelector('[data-u="'+u+'"]'); if(b){ const v=schP2(p[u]); if(b.textContent!==v) b.textContent=v; } });
    } else {
      el.textContent = left>0 ? schInlineCD(left) : 'Start time reached';
    }
  });
  const sig = schSignature();
  if(sig!==schLastSig){
    const changed = schLastSig!=='';
    schLastSig = sig;
    if(changed && (AppState.screen==='history' || AppState.screen==='home') && !$('#activeOverlay') && !document.activeElement.matches('input,select,textarea')) render();
  }
}, 1000);

/* ==========================================================================
   LIVE SCORE SHARING · CLOUD SYNC · MATCH SUBSCRIPTIONS  (additive module)
   Backend: Firebase Realtime Database (free "Spark" plan) over plain REST —
   no SDK, no library. Configure in Settings → Live Score & Cloud Sync.
     /live/{matchId}  public read-only snapshot for viewers (owner-only write)
     /sync/{uid}/matches/{matchId}  this device's cloud copy (owner-only)
   Viewers open:  <hosted index.html>?live={matchId}&db={databaseURL}
   The viewer never writes anything and never touches its own local data.
   Local-only state (kept outside DB so backups/old data are unaffected):
     tscCloudCfg_v1  {dbUrl, apiKey, viewerBase, autoSync}
     tscCloudAuth_v1 {uid, idToken, refreshToken, exp}
     tscCloudQ_v1    {dirty:{matchId:true}, lastSync}
     tscLive_v1      {matchId:{state:'live'|'paused'|'stopped', rev}}
     tscLiveSubs_v1  {matchId:{types:{start,wicket,milestone,end}, seen:{eventId:1}}}
   ========================================================================== */
const LV_AUTH = 'https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=';
const LV_REFRESH = 'https://securetoken.googleapis.com/v1/token?key=';
function lvGet(k, d){ try{ const v=JSON.parse(localStorage.getItem(k)); return v==null?d:v; }catch(e){ return d; } }
function lvSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function lvCfg(){ return lvGet('tscCloudCfg_v1', {dbUrl:'', apiKey:'', viewerBase:'', autoSync:true}); }
function lvDb(){ return (lvCfg().dbUrl||'').trim().replace(/\/+$/,''); }
function lvConfigured(){ const c=lvCfg(); return /^https?:\/\//.test(lvDb()) && !!(c.apiKey||'').trim(); }
let LV_VIEWER = false;
/* ---------- auth (anonymous, REST) ---------- */
async function lvToken(){
  if(typeof tscFbUser!=='undefined' && tscFbUser){ const t = await tscFbUser.getIdToken(); return {uid:tscFbUser.uid, idToken:t, exp:Date.now()+50*60000}; }
  const c = lvCfg(); let a = lvGet('tscCloudAuth_v1', null);
  if(a && a.idToken && a.exp > Date.now()+60000) return a;
  if(a && a.refreshToken){
    const r = await fetch(LV_REFRESH+encodeURIComponent(c.apiKey.trim()), {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(a.refreshToken)});
    if(r.ok){ const j=await r.json(); a={uid:j.user_id, idToken:j.id_token, refreshToken:j.refresh_token, exp:Date.now()+Number(j.expires_in||3600)*1000}; lvSet('tscCloudAuth_v1',a); return a; }
  }
  const r = await fetch(LV_AUTH+encodeURIComponent(c.apiKey.trim()), {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({returnSecureToken:true})});
  if(!r.ok) throw new Error('Sign-in failed ('+r.status+') — check the Web API key and that Anonymous sign-in is enabled');
  const j = await r.json();
  a = {uid:j.localId, idToken:j.idToken, refreshToken:j.refreshToken, exp:Date.now()+Number(j.expiresIn||3600)*1000};
  lvSet('tscCloudAuth_v1', a); return a;
}
async function lvPut(path, body){
  const a = await lvToken();
  const r = await fetch(lvDb()+'/'+path+'.json?auth='+encodeURIComponent(a.idToken), {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  if(!r.ok) throw new Error('Cloud write failed ('+r.status+')');
  return r.json();
}
async function lvGetJSON(path, withAuth){
  let q=''; if(withAuth){ const a=await lvToken(); q='?auth='+encodeURIComponent(a.idToken); }
  const r = await fetch(lvDb()+'/'+path+'.json'+q, {cache:'no-store'});
  if(!r.ok) throw new Error('Cloud read failed ('+r.status+')');
  return r.json();
}
/* ---------- snapshot + derived events (stable ids → no duplicate notifications) ---------- */
function lvEvents(m){
  const ev = [];
  if((m.innings||[]).some(i=>(i.timeline||[]).length)) ev.push({id:'start', type:'start', title:'Match started — first ball bowled', body:teamOf(m,'A').name+' vs '+teamOf(m,'B').name});
  (m.innings||[]).forEach((inn,i)=>{
    (inn.fallOfWickets||[]).forEach((f,k)=>ev.push({id:'w-'+i+'-'+(k+1), type:'wicket', title:'WICKET! '+f.playerName, body:teamOf(m,inn.battingTeam).name+' '+f.score+'/'+f.wicket+' ('+f.over+' ov)'}));
    Object.keys(inn.batters||{}).forEach(pid=>{
      const b=inn.batters[pid];
      [50,100].forEach(n=>{ if(b.runs>=n) ev.push({id:'ms-'+i+'-'+pid+'-'+n, type:'milestone', title:(n===100?'💯 Century: ':'⭐ Fifty: ')+playerName(pid), body:playerName(pid)+' '+b.runs+' ('+b.balls+')'}); });
    });
  });
  if(m.status==='completed' || m.status==='abandoned') ev.push({id:'end', type:'end', title:'Match finished', body: m.result? m.result.text : 'Match ended'});
  return ev;
}
function lvSnapshot(m){
  const ids = new Set([].concat(m.squadA||[], m.squadB||[]));
  (m.innings||[]).forEach(inn=>{ Object.keys(inn.batters||{}).forEach(x=>ids.add(x)); Object.keys(inn.bowlers||{}).forEach(x=>ids.add(x)); });
  const players = DB.players.filter(p=>ids.has(p.id)).map(p=>({id:p.id, name:p.name, jersey:p.jersey||''}));
  const teams = DB.teams.filter(t=>t.id===m.teamA.id||t.id===m.teamB.id).map(t=>({id:t.id, name:t.name, color:t.color, playingXI:[], bench:[]}));
  return {match:JSON.parse(JSON.stringify(m)), players, teams, events:lvEvents(m)};
}
/* ---------- Go Live publisher ---------- */
function lvLiveState(mid){ return (lvGet('tscLive_v1',{})[mid]) || null; }
function lvSetLiveState(mid, st){ const all=lvGet('tscLive_v1',{}); all[mid]=Object.assign(all[mid]||{rev:0}, st); lvSet('tscLive_v1', all); return all[mid]; }
const lvPending = new Set(); let lvTimer=null;
async function lvPublish(mid){
  const m = getMatch(mid); const st = lvLiveState(mid);
  if(!m || !st || !lvConfigured()) return;
  if(!navigator.onLine){ lvPending.add(mid); lvBadge(); return; }
  const rev = (st.rev||0)+1;
  try{
    const a = await lvToken();
    const body = Object.assign(lvSnapshot(m), {owner:a.uid, state:st.state, rev, updatedAt:{'.sv':'timestamp'}});
    await lvPut('live/'+mid, body);
    // mirror to the club's permanent link (/live/current) — only the most recently started match
    const all = lvGet('tscLive_v1',{}); let latest = null, t = -1;
    Object.keys(all).forEach(k=>{ const v=all[k].startedAt||0; if(v>t){ t=v; latest=k; } });
    if(latest===mid){ try{ await lvPut('live/current', Object.assign({}, body, {matchId:mid})); }catch(e){} }
    lvSetLiveState(mid, {rev, lastOk:Date.now(), err:null});
    lvPending.delete(mid);
  }catch(e){ lvPending.add(mid); lvSetLiveState(mid,{err:String(e.message||e)}); }
  lvBadge();
}
function lvSchedulePublish(){
  clearTimeout(lvTimer);
  lvTimer = setTimeout(()=>{
    const all = lvGet('tscLive_v1',{});
    Object.keys(all).forEach(mid=>{ if(all[mid].state==='live') lvPublish(mid); });
  }, 350);
}
function lvShareUrl(mid){
  const c = lvCfg();
  let base = (c.viewerBase||'').trim();
  if(!base && /^https?:/.test(location.protocol)) base = location.origin+location.pathname;
  if(!base) return '';
  return base.split('#')[0].split('?')[0]+'?live='+encodeURIComponent(mid)+'&db='+encodeURIComponent(lvDb());
}
async function lvGoLive(mid){
  if(!lvConfigured()){ toast('Set up Live Score & Cloud Sync in Settings first'); pushScreen('settings'); return; }
  lvSetLiveState(mid, {state:'live', startedAt:Date.now()}); await lvPublish(mid); render();

}

/* ---------- Edit previous (last) ball — uses the engine's own rebuild ---------- */
function lvEditLastBallSheet(m){

  if(!last || inn.isComplete){ toast('No ball to edit'); return; }
  if(last.wicket){ toast('The last ball was a wicket — use Undo to correct it'); return; }
  const opts=[['run',0],['run',1],['run',2],['run',3],['run',4],['run',6],['wide',0],['wide',4],['noball',0],['noball',1],['noball',4],['noball',6],['bye',1],['bye',4],['legbye',1],['legbye',4]];

    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">${opts.map(([t,r])=>`<button class="btn btn-outline btn-sm" data-lv-fix="${t}:${r}">${label(t,r)}</button>`).join('')}</div>

    const rebuilt = rebuildInningsFromEvents(m, inn, inn.timeline.slice(0,-1).concat([edited]));
    rebuilt.redoStack = [];

/* ---------- Cloud sync (idempotent: one record per match, overwritten — never appended) ---------- */
function lvSig(m){
  return m.status+'|'+(m.result?m.result.text:'')+'|'+(m.innings||[]).map(i=>i.runs+'/'+i.wickets+'/'+i.balls+'/'+(i.timeline||[]).length+'/'+(i.timeline||[]).map(e=>e.ballLabel).join(',')).join(';')+'|'+(m.editLog||[]).length;
}
const lvSigs = {};
function lvMarkDirty(){
  const q = lvGet('tscCloudQ_v1',{dirty:{}}); q.dirty=q.dirty||{}; let changed=false;
  DB.matches.forEach(m=>{ const s=lvSig(m); if(lvSigs[m.id]!==undefined && lvSigs[m.id]!==s){ q.dirty[m.id]=true; changed=true; } if(lvSigs[m.id]===undefined && !(m.id in lvSigs) && lvSeeded){ q.dirty[m.id]=true; changed=true; } lvSigs[m.id]=s; });
  if(changed) lvSet('tscCloudQ_v1', q);
  return changed;
}
let lvSeeded=false, lvSyncing=false;
async function lvFlush(){
  if(lvSyncing || !lvConfigured() || !navigator.onLine || LV_VIEWER) return;
  const q = lvGet('tscCloudQ_v1',{dirty:{}}); const ids = Object.keys(q.dirty||{});
  if(!ids.length) return;
  lvSyncing = true;
  try{
    const a = await lvToken();
    for(const mid of ids){
      const m = getMatch(mid);
      if(m) await lvPut('sync/'+a.uid+'/matches/'+mid, {match:m, sig:lvSig(m), updatedAt:{'.sv':'timestamp'}});
      const q2 = lvGet('tscCloudQ_v1',{dirty:{}});
      if(m && q2.dirty[mid] && lvSig(getMatch(mid))===lvSig(m)) delete q2.dirty[mid];   // only clear if unchanged while uploading
      if(!m) delete q2.dirty[mid];
      q2.lastSync = Date.now(); lvSet('tscCloudQ_v1', q2);
    }
  }catch(e){ console.warn('Cloud sync failed', e); }
  lvSyncing = false; lvBadge();
  const left = Object.keys(lvGet('tscCloudQ_v1',{dirty:{}}).dirty||{}).length;
  if(left && navigator.onLine) setTimeout(lvFlush, 3000);
}
async function lvVerify(){
  if(!lvConfigured()){ toast('Set up cloud sync first'); return; }
  if(!navigator.onLine){ toast('Connect to the internet to verify'); return; }
  toast('Checking cloud copies…');
  await lvFlush();
  let rows='', ok=0, bad=0;
  try{
    const a = await lvToken();
    const cloud = (await lvGetJSON('sync/'+a.uid+'/matches', true)) || {};
    DB.matches.slice().sort((x,y)=>new Date(y.date)-new Date(x.date)).slice(0,15).forEach(m=>{
      const c = cloud[m.id] && cloud[m.id].match;
      const loc = (m.innings||[]).map(i=>i.runs+'/'+i.wickets+' ('+fmtOvers(i.balls,m.ballsPerOver)+') · '+(i.timeline||[]).length+' balls').join(' | ');
      const cl = c ? (c.innings||[]).map(i=>i.runs+'/'+i.wickets+' ('+fmtOvers(i.balls,c.ballsPerOver)+') · '+(i.timeline||[]).length+' balls').join(' | ') : 'Not in cloud';
      const same = !!c && lvSig(c)===lvSig(m);
      same?ok++:bad++;
      rows += `<tr><td data-no-tr>${esc(teamOf(m,'A').name)} vs ${esc(teamOf(m,'B').name)}<div style="font-size:11px;color:var(--clr-text-dim)">Local: ${esc(loc)}<br>Cloud: ${esc(cl)}</div></td><td style="font-weight:800;color:${same?'#1E9E5A':'#37474F'}">${same?'✓':'✗'}</td></tr>`;
    });
  }catch(e){ toast(String(e.message||e)); return; }
  openSheet(`<h2>Cloud Sync Check</h2><p style="font-size:12.5px;margin:0 0 8px">${ok} match${ok!==1?'es':''} identical in cloud · ${bad} different or missing</p>
    <table class="idc-dtable">${rows||'<tr><td>No matches yet.</td></tr>'}</table>
    <button class="btn btn-ghost btn-block" style="margin-top:8px" data-action="dismiss-sheet">Close</button>`);
}
/* ---------- Settings section ---------- */
function lvSettingsHTML(){
  const c = lvCfg(), a = lvGet('tscCloudAuth_v1',null), q = lvGet('tscCloudQ_v1',{dirty:{}});
  const pending = Object.keys(q.dirty||{}).length;
  return `<div class="section-title">Live Score & Cloud Sync</div>
  <div class="card">

    case 'lv-native-share': { const u=lvShareUrl(id); const m=getMatch(id); if(navigator.share) navigator.share({title:'Live score', text:m?teamOf(m,'A').name+' vs '+teamOf(m,'B').name:'', url:u}).catch(()=>{}); else toast('Sharing not supported here — use Copy Link'); break; }

function liveViewerBoot(){

function lvApplySnapshot(d){
  if(!d || !d.match) { LV_VIEW.data = d; return; }
  if(d.match.id !== LV_VIEW.lastMid){ LV_VIEW.lastMid = d.match.id; LV_VIEW.lastRev = -1; }   // permanent link switched to a new match
  if(typeof d.rev==='number' && d.rev < LV_VIEW.lastRev) return;      // ignore out-of-order
  LV_VIEW.lastRev = d.rev||0; LV_VIEW.data = d;
  DB.players = d.players||[]; DB.teams = d.teams||[]; DB.matches = [d.match];
  PUBLIC_MODE_MATCH_ID = d.match.id;

function lvViewerConnect(){
  const url = LV_VIEW.db+'/live/'+encodeURIComponent(LV_VIEW.mid)+'.json';
  const poll = async ()=>{
    try{ const r=await fetch(url,{cache:'no-store'}); if(r.ok){ lvApplySnapshot(await r.json()); LV_VIEW.conn='ok'; } else LV_VIEW.conn='error'; }
    catch(e){ LV_VIEW.conn='offline'; }
    lvViewerRender();
  };
  if(typeof EventSource!=='undefined'){
    try{
      const es = new EventSource(url); LV_VIEW.es = es;
      es.addEventListener('put', ()=>poll());      // any change → fetch the full, consistent snapshot
      es.addEventListener('patch', ()=>poll());
      es.onerror = ()=>{ LV_VIEW.conn = navigator.onLine?'reconnecting':'offline'; lvViewerRender(); };
      es.onopen = ()=>{ LV_VIEW.conn='ok'; };
    }catch(e){}
  }
  poll();
  setInterval(poll, 10000);                         // safety net if streaming is blocked
  window.addEventListener('online', poll);
}

function cbxPartnership(inn){
  let runs=0, balls=0;
  for(let i=inn.timeline.length-1;i>=0;i--){
    const e = inn.timeline[i];
    if(e.wicket) break;
    runs += (e.runs||0) + (e.extraRuns||0) + ((e.extraType==='wide'||e.extraType==='noball')?1:0);
    if(e.isLegal) balls++;
  }
  return {runs, balls};
}
function cbxMaidens(m, inn, bowlerId){
  const bpo = m.ballsPerOver||6; let maid=0, legal=0, conceded=0;
  inn.timeline.forEach(e=>{
    if(e.bowlerId!==bowlerId) return;
    const bowlerRuns = (e.extraType==='bye'||e.extraType==='legbye') ? 0 : (e.runs||0)+(e.extraType==='wide'?1+(e.extraRuns||0):0)+(e.extraType==='noball'?1:0);
    conceded += bowlerRuns;
    if(e.isLegal){ legal++; if(legal%bpo===0){ if(conceded===0) maid++; conceded=0; } }
  });
  return maid;
}
function cbxNeedText(m, inn){
  const bat = teamOf(m, inn.battingTeam).name;
  const maxBalls = m.overs*m.ballsPerOver;
  if(inn.target!=null){
    const need = Math.max(0, inn.target - inn.runs), left = Math.max(0, maxBalls - inn.balls);
    if(need===0) return {cls:'done', text: bat+' reached the target'};
    return {cls:'', text: bat+' need '+need+' run'+(need!==1?'s':'')+' in '+left+' ball'+(left!==1?'s':'')};
  }
  const proj = inn.balls>0 ? Math.round(inn.runs/inn.balls*maxBalls) : 0;
  return {cls:'first', text: bat+' batting first'+(inn.balls>=6?' · Projected '+proj:'')};
}
