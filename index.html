function refreshDBFromStorage(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(!raw) return;
    const parsed = JSON.parse(raw);
    Object.keys(DB).forEach(k=>{ delete DB[k]; });
    Object.assign(DB, parsed);
    StorageManager._cache = DB;
  }catch(e){ console.error('Public view refresh failed', e); }
}
function startPublicViewAutoRefresh(){
  window.addEventListener('storage', (e)=>{
    if(e.key===DB_KEY){ refreshDBFromStorage(); render(); }
  });
  setInterval(()=>{ refreshDBFromStorage(); render(); }, 4000);
}

/* ==========================================================================
   SMART NOTIFICATIONS (additive)
   In-app notification feed (DB.notifications) plus best-effort browser push
   via the Notification API when the user opts in from Settings. No backend
   exists in this offline file, so push only fires while this tab/app is
   open — that's an inherent limit of a static single-file app, not a bug.
   ========================================================================== */
const NOTIF_TYPES = {
  matchStart:{icon:'🏏', label:'Match Start'},
  toss:{icon:'🪙', label:'Toss'},
  inningsBreak:{icon:'⏸️', label:'Innings Break'},
  matchResult:{icon:'🏆', label:'Match Result'},
  tournament:{icon:'📋', label:'Tournament Update'},
  funding:{icon:'💰', label:'Funding Reminder'},
  backup:{icon:'💾', label:'Backup Reminder'},
};
function notify(type, title, body, meta){
  const n = {id:uid('nt'), type, title, body, meta:meta||null, time:new Date().toISOString(), read:false};
  DB.notifications.unshift(n);
  if(DB.notifications.length>150) DB.notifications.length=150; // cap the feed, keep most recent
  StorageManager.save();
  if(DB.settings.pushEnabled && typeof Notification!=='undefined' && Notification.permission==='granted'){
    try{ new Notification(title, {body}); }catch(e){ /* best-effort only */ }
  }
}
function unreadNotifCount(){ return DB.notifications.filter(n=>!n.read).length; }
function daysSince(iso){
  if(!iso) return Infinity;
  return (Date.now() - new Date(iso).getTime()) / 86400000;
}
function checkBackupReminder(){
  const s = DB.settings;
  if(!s.backupReminderEnabled) return;
  if(!DB.matches.length && !DB.tournaments.length) return; // nothing worth backing up yet
  const intervalDays = s.backupReminderDays || 7;
  const sinceBackup = daysSince(s.lastBackupDate);
  const sinceReminder = daysSince(s.lastBackupReminderDate);
  if(sinceBackup>=intervalDays && sinceReminder>=intervalDays){
    notify('backup', 'Backup Reminder', `It's been ${Math.floor(sinceBackup)===Infinity?'a while':Math.floor(sinceBackup)+' days'} since your last backup. Export one from Settings to keep your data safe.`, null);
    s.lastBackupReminderDate = new Date().toISOString();
    StorageManager.save();
  }
}
function sendManualBackupReminder(){
  notify('backup', 'Backup Reminder', 'Manual reminder — export your tournament data from Settings.', null);
  DB.settings.lastBackupReminderDate = new Date().toISOString();
  StorageManager.save();
  toast('Reminder added to notifications');
}
function notificationsScreenHTML(){
  if(!DB.notifications.length){
    return `<div class="card empty-state">${icon('empty')}<p>No notifications yet. You'll see match starts, toss results, innings breaks, results, tournament updates and funding reminders here automatically.</p></div>`;
  }
  return DB.notifications.map(n=>{
    const meta = NOTIF_TYPES[n.type] || {icon:'🔔', label:'Update'};
    return `<div class="card match-card ${n.read?'':'card-tap'}" data-action="open-notification" data-id="${n.id}" style="${n.read?'':'border-color:var(--clr-primary)'}">
      <div class="mc-icon" style="background:var(--clr-surface-alt);color:var(--clr-text);font-size:18px">${meta.icon}</div>
      <div class="mc-body">
        <div class="mc-title">${esc(n.title)}</div>
        <div class="mc-sub">${esc(n.body)}</div>
      </div>
      ${!n.read?'<span class="badge">NEW</span>':''}
    </div>`;
  }).join('');
}
function openNotification(id){
  const n = DB.notifications.find(x=>x.id===id);
  if(!n) return;
  n.read = true;
  StorageManager.save();
  if(n.meta && n.meta.matchId && getMatch(n.meta.matchId)){
    AppState.currentMatchId = n.meta.matchId;
    pushScreen('live');
    return;
  }
  if(n.meta && n.meta.tournamentId && getTournament(n.meta.tournamentId)){
    pushScreen('tournamentDetail', {id:n.meta.tournamentId});
    return;
  }
  render();
}
function markAllNotificationsRead(){
  DB.notifications.forEach(n=>n.read=true);
  StorageManager.save();
  render();
}
function requestPushPermission(){
  if(typeof Notification==='undefined'){ toast('Push notifications are not supported in this browser'); return; }
  Notification.requestPermission().then(perm=>{
    DB.settings.pushEnabled = (perm==='granted');
    StorageManager.save();
    render();
    toast(perm==='granted' ? 'Push notifications enabled' : 'Push permission was not granted');
  });
}

  else if(e.target.id==='tournamentLinkSel'){ ensureDraft().tournamentId = e.target.value; }

});
document.addEventListener('input',(e)=>{
  if(e.target.id==='searchInput'){
    AppState.historyFilter = e.target.value;
    clearTimeout(window.__searchDebounce);
    window.__searchDebounce = setTimeout(()=>{
      const app=$('#app .screen');
      if(app) app.innerHTML = screenHTML();
    },150);
  }
  else if(e.target.id==='tourneyName'){ ensureTournamentDraft().name = e.target.value; }
  else if(e.target.id==='tourneyOvers'){ ensureTournamentDraft().overs = e.target.value; }
  else if(e.target.id==='tourneyEntryFee'){ ensureTournamentDraft().entryFee = e.target.value; }
});

function seedSampleDataIfEmpty(){
  if(DB.players.length===0 && DB.teams.length===0){
    const mkPlayer=(name,jersey,bat,bowl)=>{ const p={id:uid('p'),name,jersey,battingStyle:bat,bowlingStyle:bowl}; DB.players.push(p); return p.id; };
    const aNames=['Rafiq Islam','Tanvir Ahmed','Shakib Rahman','Mushfiq Karim','Nayeem Hasan','Imran Chowdhury','Sabbir Khan','Al-Amin Hossain','Rubel Mia','Taskin Uddin','Liton Sheikh'];
    const bNames=['Farhan Kabir','Zunaid Alam','Mahmudul Haque','Sohel Rana','Abir Talukdar','Rakib Molla','Emon Sarkar','Fahim Reza','Jubayer Khondkar','Naeem Bhuiyan','Ashraf Miah'];
    const aIds = aNames.map((n,i)=>mkPlayer(n, i+1, i%3===0?'Left-hand bat':'Right-hand bat', i%4===0?'Right-arm fast':(i%4===1?'Right-arm off-spin':'None')));
    const bIds = bNames.map((n,i)=>mkPlayer(n, i+1, i%3===1?'Left-hand bat':'Right-hand bat', i%4===0?'Left-arm medium':(i%4===2?'Right-arm leg-spin':'None')));
    DB.teams.push({id:uid('t'), name:'Dhaka Warriors', color:'#0B6E4F', captainId:aIds[0], viceCaptainId:aIds[1], playingXI:aIds, bench:[]});
    DB.teams.push({id:uid('t'), name:'Chattogram Tigers', color:'#1866DB', captainId:bIds[0], viceCaptainId:bIds[1], playingXI:bIds, bench:[]});
    StorageManager.save();
  }
}
function init(){
  if(typeof liveViewerBoot==='function' && liveViewerBoot()) return;
  detectPublicModeFromURL();
  if(PUBLIC_MODE_MATCH_ID){
    document.body.setAttribute('data-theme', DB.settings.theme);
    render();
    startPublicViewAutoRefresh();
    return;
  }
  if(typeof authGateStart==='function') authGateStart();
  seedSampleDataIfEmpty();
  document.body.setAttribute('data-theme', DB.settings.theme);
  render();
  checkBackupReminder();
}
init();

<script>
(function(){
  if('serviceWorker' in navigator && location.protocol!=='file:'){
    window.addEventListener('load',function(){ navigator.serviceWorker.register('./sw.js').catch(function(){}); });
  }
  var deferred=null, btn=document.getElementById('pwaInstallBtn');
  var dismissed=false; try{dismissed=sessionStorage.getItem('pwaDismiss')==='1';}catch(e){}
  window.addEventListener('beforeinstallprompt',function(e){
    e.preventDefault(); deferred=e;
    if(!dismissed && !/[?&]public=/.test(location.search)) btn.style.display='inline-flex';
  });
  btn.addEventListener('click',function(ev){
    btn.style.display='none';
    if(ev.target.classList.contains('x')){ try{sessionStorage.setItem('pwaDismiss','1');}catch(e){} return; }
    if(deferred){ deferred.prompt(); deferred.userChoice.finally(function(){deferred=null;}); }
  });
  window.addEventListener('appinstalled',function(){ btn.style.display='none'; deferred=null; });
})();
</script>
